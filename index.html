<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Diário de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app; bottom tab bar; sheets slide up from the bottom. Rubber-floor dark, plate colors as the system. */
:root {
  --bg: #111215;
  --bg2: #16181c;
  --card: #1b1e23;
  --card2: #23272e;
  --line: #2b3038;
  --text: #eeebe5;
  --muted: #8f959e;
  --dim: #626872;
  --accent: #ff5236;
  --accent2: #ff7a5c;
  --on-accent: #1d0b06;
  --p25: #e5383b;
  --p20: #3a86ff;
  --p15: #f2c230;
  --p10: #2eb67d;
  --p5: #e8e6e1;
  --cardio: #3a86ff;
  --stretch: #2eb67d;
  --rest: #9a9cf0;
  --good: #36c98b;
  --fig: #ece8df;
  --fig2: #6f7782;
  --steel: #9aa4b2;
  --steel2: #c7ced8;
  --pad: #353b45;
  --pad2: #4a5260;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 18px;
  --ease: cubic-bezier(.2, .85, .25, 1);
  --spring: cubic-bezier(.25, 1.25, .4, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(rgba(255, 255, 255, .028) 1px, transparent 1.3px) 0 0 / 7px 7px,
    radial-gradient(rgba(255, 82, 54, .03) 1px, transparent 1.4px) 3px 4px / 13px 13px,
    var(--bg);
  color: var(--text);
  font: 16px/1.4 var(--body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }
main#view { padding: calc(14px + var(--sat)) 16px calc(104px + var(--sab)); }
main#view.enter { animation: viewIn .34s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* press feedback */
.tap { position: relative; overflow: hidden; transition: transform .2s var(--spring), background-color .2s, border-color .2s, opacity .2s; user-select: none; -webkit-user-select: none; }
.tap:active { transform: scale(.965); }
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .18; transform: scale(0); animation: rip .55s var(--ease) forwards; }
@keyframes rip { to { transform: scale(1); opacity: 0; } }

/* header */
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
.eyebrow { font: 600 12.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1.title { font: 700 34px/1.02 var(--display); letter-spacing: .005em; margin: 8px 0 0; text-wrap: balance; }
h2.sec { font: 700 22px/1.1 var(--display); letter-spacing: .01em; margin: 26px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h2.sec small { font: 500 13px var(--body); color: var(--muted); letter-spacing: 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--text); flex: none; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.sync b { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
.sync.cloud b { background: var(--good); }
.sync.saving b { background: var(--p15); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* tab bar */
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 8px calc(8px + var(--sab)); background: rgba(17, 18, 21, .86); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border-radius: 14px; color: var(--dim); font: 600 11.5px var(--body); letter-spacing: .02em; }
.tab svg.i { width: 24px; height: 24px; transition: transform .3s var(--spring); }
.tab.on { color: var(--text); }
.tab.on svg.i { color: var(--accent); transform: translateY(-1px) scale(1.08); }

/* treino em andamento */
.mini { position: fixed; left: 50%; bottom: calc(80px + var(--sab)); transform: translate(-50%, 20px); opacity: 0; width: calc(100% - 24px); max-width: 496px; z-index: 29; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: var(--card2); border: 1px solid var(--line); text-align: left; box-shadow: 0 12px 32px rgba(0, 0, 0, .45); transition: transform .45s var(--spring), opacity .3s; }
.mini.on { transform: translate(-50%, 0); opacity: 1; }
.mini > i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); animation: pulse 1.6s infinite; flex: none; }
.mini-t { flex: 1; min-width: 0; }
.mini-t b { display: block; font: 700 17px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-t small { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mini .go { display: inline-flex; align-items: center; gap: 4px; font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--accent2); }
.mini .go svg.i { width: 16px; height: 16px; }
body.has-mini main#view { padding-bottom: calc(170px + var(--sab)); }

/* chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font: 600 14px var(--body); white-space: nowrap; }
.chip.on { background: var(--text); color: #111; border-color: var(--text); }
.chip.sm { height: 26px; padding: 0 10px; font-size: 12.5px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 600 11.5px var(--body); letter-spacing: .04em; text-transform: uppercase; background: var(--card2); color: var(--muted); }

/* buttons */
.btn { height: 54px; padding: 0 22px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 18px var(--display); letter-spacing: .04em; text-transform: uppercase; background: var(--card2); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 10px 28px -12px rgba(255, 82, 54, .7); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { height: 42px; font-size: 15px; padding: 0 16px; border-radius: 13px; }
.btn.danger { color: #ff8a7a; }
.link { color: var(--accent2); font-weight: 600; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 9px; border-radius: 16px; background: var(--card); border: 1px solid transparent; }
.wd-l { font: 600 11px var(--body); color: var(--muted); letter-spacing: .08em; }
.wd-n { font: 700 21px/1 var(--display); }
.wd-dot { width: 18px; height: 18px; display: grid; place-items: center; }
.wd-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: block; }
.wd-dot.done i { width: 18px; height: 18px; display: grid; place-items: center; }
.wd-dot svg { width: 12px; height: 12px; stroke: #111; stroke-width: 3.2; fill: none; }
.wd-dot .moon { width: 13px; height: 13px; color: var(--rest); stroke-width: 2.2; }
.wd.today .wd-n { color: var(--accent); }
.wd.sel { border-color: var(--text); background: var(--card2); }

/* day card */
.daycard { margin-top: 14px; background: var(--card); border-radius: 22px; border: 1px solid var(--line); overflow: hidden; position: relative; }
.daycard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
.dc-in { padding: 18px 16px 16px; }
.dc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dc-title { font: 700 30px/1.02 var(--display); margin: 10px 0 8px; text-wrap: balance; }
.dc-meta { color: var(--muted); font-size: 14px; }
.dc-list { margin: 12px 0 14px; display: grid; gap: 2px; }
.dl { display: grid; grid-template-columns: 22px 48px 1fr auto; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.dl:first-child { border-top: 0; }
.dl-n { font: 700 16px var(--display); color: var(--dim); text-align: center; }
.th { width: 48px; height: 40px; border-radius: 10px; background: var(--bg2); display: block; overflow: hidden; }
.th svg { width: 100%; height: 100%; }
.dl-t { font-size: 14.5px; line-height: 1.2; }
.dl-t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.dl-w { font: 600 16px var(--display); color: var(--muted); text-align: right; white-space: nowrap; }
.dc-actions { display: flex; gap: 10px; }
.dc-actions .btn.primary { flex: 1; }
.rest-hero { display: grid; place-items: center; text-align: center; padding: 26px 10px 8px; }
.rest-hero svg.i { width: 54px; height: 54px; color: var(--rest); stroke-width: 1.5; }
.rest-hero h3 { font: 700 28px var(--display); margin: 10px 0 4px; }
.rest-hero p { color: var(--muted); margin: 0 0 16px; font-size: 15px; max-width: 30ch; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qbtn { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line); text-align: left; font-weight: 600; font-size: 15px; }
.qbtn svg.i { color: var(--c); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 10px; }
.tile b { display: block; font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.tile span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; line-height: 1.2; }

/* suggestion */
.sug { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 8px; text-align: left; width: 100%; }
.sug .th { width: 52px; height: 44px; }
.sug-t { font-size: 14.5px; line-height: 1.25; }
.sug-t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.upchip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px; background: rgba(54, 201, 139, .14); color: var(--good); font: 700 16px var(--display); white-space: nowrap; }
.upchip svg.i { width: 15px; height: 15px; stroke-width: 2.6; }
.banner { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: rgba(54, 201, 139, .1); border: 1px solid rgba(54, 201, 139, .3); color: #bff0d9; font-size: 14px; line-height: 1.3; margin-bottom: 12px; }
.banner svg.i { color: var(--good); }
.banner .btn { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; background: var(--good); color: #062014; border: 0; flex: none; }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; background: var(--card); border: 1px dashed var(--line); border-radius: 18px; font-size: 14.5px; }

/* calendar */
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-h h3 { font: 700 24px var(--display); margin: 0; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .cw { text-align: center; font: 600 11px var(--body); color: var(--dim); letter-spacing: .08em; padding: 4px 0; }
.cd { aspect-ratio: 1 / 1.12; border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0 5px; border: 1px solid transparent; }
.cd.out { opacity: .32; }
.cd .n { font: 700 17px/1 var(--display); }
.cd.today { border-color: var(--accent); }
.cd .bar { width: 62%; height: 5px; border-radius: 3px; background: var(--c); opacity: .5; }
.cd.done .bar { opacity: 1; height: 7px; }
.cd.miss .bar { background: transparent; border: 1.5px solid var(--c); height: 6px; opacity: .8; }
.cd .moon { width: 13px; height: 13px; color: var(--rest); }
.cd.done { background: var(--card2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 5px; border-radius: 3px; background: var(--muted); display: inline-block; }
.wk { display: grid; gap: 6px; }
.wk-row { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 15px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.wk-row b { font: 700 17px var(--display); letter-spacing: .02em; }
.wk-v { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; min-width: 0; }
.wk-v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-v .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.wk-row svg.i { color: var(--dim); width: 18px; height: 18px; }
.wk-v.rest { color: var(--rest); }
.wk-v.free { color: var(--muted); }

/* workouts list */
.wcard { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 14px; margin-bottom: 10px; position: relative; overflow: hidden; }
.wcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.wcard h3 { font: 700 25px/1.05 var(--display); margin: 0 0 6px; }
.wcard p { margin: 0; color: var(--muted); font-size: 14px; }
.wthumbs { display: flex; gap: 6px; margin-top: 12px; overflow: hidden; }
.wthumbs .th { width: 52px; height: 44px; flex: none; }
.wthumbs .more { width: 44px; height: 44px; border-radius: 10px; background: var(--bg2); display: grid; place-items: center; color: var(--muted); font: 700 15px var(--display); flex: none; }
.days-of { display: flex; gap: 4px; margin-top: 10px; }
.days-of span { font: 700 12px var(--display); width: 26px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--bg2); color: var(--dim); }
.days-of span.on { background: var(--c); color: #111; }

/* library */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 15px; background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 16px; min-width: 0; }
.search svg.i { color: var(--muted); }
.lib-sub { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 2px 8px; }
.li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 10px 8px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
.li .th { width: 64px; height: 54px; }
.li-t { font-size: 15px; line-height: 1.25; }
.li-t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.li-r { color: var(--dim); }
.li .ck { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .25s var(--spring); }
.li .ck svg { width: 16px; height: 16px; stroke: #111; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.4); transition: all .25s var(--spring); }
.li.on { border-color: var(--accent); }
.li.on .ck { background: var(--accent); border-color: var(--accent); }
.li.on .ck svg { opacity: 1; transform: none; }
.li .ord { position: absolute; }

/* progress */
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 8px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { font: 500 10.5px var(--body); fill: var(--dim); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: url(#gA); }
.chart .pt { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .lb { font: 700 12px var(--display); fill: var(--text); }
.chart .br { fill: var(--accent); }
.chart .br.cur { fill: var(--accent2); }
.pe { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
.pe .th { width: 52px; height: 44px; }
.pe-t { font-size: 14.5px; line-height: 1.2; min-width: 0; }
.pe-t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.pe-r { text-align: right; }
.pe-r b { font: 700 20px var(--display); display: block; }
.pe-r small { font: 600 12.5px var(--body); }
.up { color: var(--good); }
.down { color: #ff8a7a; }
.spark { width: 64px; height: 22px; display: block; margin-left: auto; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(4, 5, 7, .62); z-index: 50; opacity: 0; transition: opacity .3s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 51; width: 100%; max-width: 520px; max-height: calc(100% - 28px - var(--sat)); display: flex; flex-direction: column; background: var(--bg2); border-radius: 26px 26px 0 0; border: 1px solid var(--line); border-bottom: 0; transform: translate(-50%, 104%); transition: transform .42s var(--ease); box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); }
.sheet.on { transform: translate(-50%, 0); }
.sheet.full { height: calc(100% - 28px - var(--sat)); }
.sheet.drag { transition: none; }
.sh-h { flex: none; padding: 10px 16px 6px; touch-action: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--pad2); margin: 0 auto 10px; }
.sh-t { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sh-t h3 { font: 700 24px/1.08 var(--display); margin: 0; text-wrap: balance; }
.sh-t .icon-btn { width: 38px; height: 38px; border-radius: 12px; }
.sh-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.sh-b { flex: 1; overflow-y: auto; padding: 8px 16px 16px; overscroll-behavior: contain; }
.sh-f { flex: none; padding: 10px 16px calc(12px + var(--sab)); border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--bg2); }
.sh-f .btn { flex: 1; }

/* session screen */
.sess { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .45s var(--ease); max-width: 520px; margin: 0 auto; }
.sess.on { transform: none; }
.ss-h { flex: none; padding: calc(10px + var(--sat)) 12px 10px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; background: rgba(17, 18, 21, .92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.ss-ttl { text-align: center; min-width: 0; }
.ss-ttl b { display: block; font: 700 20px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-ttl span { font: 600 14px var(--display); color: var(--muted); letter-spacing: .06em; }
.prog { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin: 8px 4px 0; grid-column: 1 / -1; }
.prog i { display: block; height: 100%; width: 0; background: var(--c, var(--accent)); border-radius: 2px; transition: width .5s var(--ease); }
.ss-b { flex: 1; overflow-y: auto; padding: 14px 12px calc(170px + var(--sab)); overscroll-behavior: contain; }
.ss-f { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(12px + var(--sab)); background: linear-gradient(transparent, var(--bg) 32%); display: flex; gap: 10px; }
.ss-f .btn.primary { flex: 1; }
.sec-l { display: flex; align-items: center; gap: 8px; font: 700 20px var(--display); margin: 22px 4px 10px; }
.sec-l svg.i { color: var(--c); }
.sec-l small { margin-left: auto; font: 500 13px var(--body); color: var(--muted); }

.xc { background: var(--card); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 10px; overflow: hidden; transition: border-color .3s; }
.xc.done { border-color: rgba(54, 201, 139, .4); }
.xc-h { display: grid; grid-template-columns: 30px 58px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px 10px 10px; }
.xc-n { width: 28px; height: 28px; border-radius: 9px; background: var(--card2); display: grid; place-items: center; font: 700 16px var(--display); }
.xc.done .xc-n { background: var(--good); color: #062014; }
.xc-h .th { width: 58px; height: 48px; }
.xc-t b { display: block; font-size: 15px; line-height: 1.2; font-weight: 600; }
.xc-t small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.xc-st { font: 700 17px var(--display); color: var(--muted); display: flex; align-items: center; gap: 4px; }
.xc-st svg.i { width: 18px; height: 18px; transition: transform .35s var(--spring); }
.xc.open .xc-st svg.i { transform: rotate(180deg); }
.xc-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.xc.open .xc-b { grid-template-rows: 1fr; }
.xc-bi { overflow: hidden; }
.xc-bp { padding: 0 12px 12px; }
.anim { border-radius: 16px; background: radial-gradient(120% 90% at 50% 100%, #1f232a, var(--bg2)); overflow: hidden; position: relative; }
.anim svg { width: 100%; height: auto; display: block; }
.anim-in { width: 100%; height: 100%; }
.xc-bp > .anim { height: 190px; }
.sheet .sh-b > .anim { height: 240px; }
.xc-bp > .anim svg, .sheet .sh-b > .anim svg { height: 100%; }
.anim .mus { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.anim .mus span { font: 600 11px var(--body); padding: 3px 7px; border-radius: 6px; background: rgba(255, 82, 54, .16); color: #ffb3a5; }
.howto { margin: 8px 0 4px; }
.howto summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--accent2); font-weight: 600; font-size: 14px; padding: 6px 0; }
.howto summary::-webkit-details-marker { display: none; }
.howto ol { margin: 4px 0 6px; padding-left: 20px; color: #cfcac2; font-size: 14.5px; line-height: 1.45; }
.howto li { margin-bottom: 4px; }
.last { font-size: 13.5px; color: var(--muted); margin: 6px 2px 10px; }
.last b { color: var(--text); font-weight: 600; }
.sets { display: grid; gap: 6px; }
.set-h, .set { display: grid; grid-template-columns: 34px 1fr 124px 46px; align-items: center; gap: 8px; }
.set-h { font: 600 10.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 0 6px; }
.set-h span:first-child { text-align: center; }
.set-h span:nth-child(3) { text-align: center; }
.set { background: var(--bg2); border-radius: 14px; padding: 6px; transition: background .35s; }
.set.done { background: rgba(54, 201, 139, .1); }
.set-i { font: 700 18px var(--display); text-align: center; color: var(--muted); }
.wbtn { height: 46px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; font: 700 23px var(--display); font-variant-numeric: tabular-nums; }
.wbtn small { font: 600 12px var(--body); color: var(--muted); }
.wbtn em { font: 700 13px var(--display); font-style: normal; margin-left: 4px; }
.wbtn.empty { color: var(--accent2); font-size: 16px; }
.step { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; height: 46px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; }
.step button { height: 100%; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.step button svg.i { width: 18px; height: 18px; }
.step span { text-align: center; font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.step span small { font: 600 11px var(--body); color: var(--muted); margin-left: 2px; }
.bump { animation: bump .32s var(--spring); }
@keyframes bump { 40% { transform: scale(1.22); } }
.chk { width: 46px; height: 46px; border-radius: 13px; border: 2px solid var(--pad2); display: grid; place-items: center; transition: background .25s, border-color .25s; }
.chk svg { width: 24px; height: 24px; fill: none; stroke: #062014; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.chk svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .35s var(--ease) .05s; }
.chk.on { background: var(--good); border-color: var(--good); }
.chk.on svg path { stroke-dashoffset: 0; }
.chk.pop { animation: pop .4s var(--spring); }
@keyframes pop { 30% { transform: scale(.85); } 70% { transform: scale(1.1); } }
.xc-f { display: flex; gap: 8px; margin-top: 10px; }
.xc-f .btn { flex: 1; }
.addrow { display: flex; gap: 8px; margin-top: 4px; }
.addrow .btn { flex: 1; }

.cc { display: grid; grid-template-columns: 92px 1fr 46px; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; margin-bottom: 8px; position: relative; }
.cc.done { border-color: rgba(54, 201, 139, .4); }
.cc .anim { width: 92px; height: 77px; border-radius: 12px; }
.cc-t { min-width: 0; }
.cc-t b { display: block; font-size: 14.5px; line-height: 1.2; font-weight: 600; padding-right: 24px; }
.cc-c { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.cc .step { height: 38px; grid-template-columns: 32px 66px 32px; }
.cc .step span { font-size: 18px; }
.seg { display: inline-flex; background: var(--card2); border-radius: 11px; padding: 3px; border: 1px solid var(--line); }
.seg button { height: 30px; padding: 0 9px; border-radius: 8px; font: 600 12.5px var(--body); color: var(--muted); }
.seg button.on { background: var(--cardio); color: #fff; }
.cc .x { position: absolute; top: 6px; right: 62px; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--dim); }
.cc .x svg.i { width: 16px; height: 16px; }
.ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--stretch) calc(var(--p, 0) * 1turn), var(--card2) 0); position: relative; }
.ring::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--card); }
.ring svg.i, .ring span { position: relative; z-index: 1; width: 18px; height: 18px; }
.ring span { width: auto; height: auto; font: 700 15px var(--display); }

.restpill { position: absolute; left: 50%; bottom: calc(84px + var(--sab)); transform: translate(-50%, 30px) scale(.9); opacity: 0; pointer-events: none; z-index: 45; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 99px; background: var(--text); color: #111; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); transition: all .4s var(--spring); }
.restpill.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.restpill b { font: 700 24px var(--display); font-variant-numeric: tabular-nums; min-width: 52px; }
.restpill span { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.restpill button { height: 38px; padding: 0 12px; border-radius: 99px; background: rgba(0, 0, 0, .08); font: 700 15px var(--display); }

/* weight picker */
.wp-val { text-align: center; margin: 4px 0 2px; }
.wp-val b { font: 700 76px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wp-val small { display: block; font: 600 13px var(--body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
.wp-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 12px; min-height: 20px; }
.wp-hint b { color: var(--good); }
.wp-plates { display: flex; flex-direction: column; align-items: center; margin: 6px 0 12px; }
.wp-plates svg { width: 100%; max-width: 380px; height: 84px; }
.wp-plates p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.ruler-w { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 6px; }
.ruler-w > button { height: 56px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); display: grid; place-items: center; }
.ruler { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 calc(50% - 30px); height: 64px; align-items: center; mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
.ruler::-webkit-scrollbar { display: none; }
.ruler button { flex: none; width: 60px; height: 52px; scroll-snap-align: center; font: 700 21px var(--display); color: var(--dim); font-variant-numeric: tabular-nums; transition: color .2s, transform .25s var(--spring); position: relative; }
.ruler button::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 2px; height: 8px; background: var(--pad2); transform: translateX(-50%); }
.ruler button.on { color: var(--text); transform: scale(1.18); }
.ruler button.on::after { background: var(--accent); height: 12px; }

/* editor */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font: 600 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.inp { width: 100%; height: 52px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); padding: 0 14px; font-size: 18px; outline: 0; }
.inp:focus { border-color: var(--text); }
textarea.inp { height: 110px; padding: 10px 14px; font: 13px/1.4 ui-monospace, monospace; }
.colors { display: flex; gap: 10px; }
.colors button { width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 3px solid transparent; box-shadow: inset 0 0 0 3px var(--bg2); transition: transform .25s var(--spring); }
.colors button.on { border-color: var(--text); transform: scale(1.08); }
.er { display: grid; grid-template-columns: 26px 30px 52px 1fr auto; align-items: center; gap: 8px; padding: 8px 8px 8px 4px; background: var(--card); border: 1px solid var(--line); border-radius: 15px; margin-bottom: 6px; }
.er-h { display: grid; place-items: center; color: var(--dim); touch-action: none; cursor: grab; height: 40px; }
.er-n { font: 700 18px var(--display); color: var(--accent2); text-align: center; }
.er .th { width: 52px; height: 44px; }
.er-t { min-width: 0; text-align: left; }
.er-t b { display: block; font-size: 14px; line-height: 1.2; font-weight: 600; }
.er-t small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.er-a { display: flex; gap: 2px; }
.er-a button { width: 32px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.er-a button svg.i { width: 18px; height: 18px; }
.er-x { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 0 2px 34px; }
.er-x label { font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: grid; gap: 5px; }
.er-x .inp { height: 44px; font: 700 20px var(--display); text-align: center; }
.sortable-ghost { opacity: .35; }
.sortable-chosen { box-shadow: 0 12px 30px rgba(0, 0, 0, .5); border-color: var(--accent); }

/* opt list */
.opt { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 15px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; font-size: 15.5px; }
.opt .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.opt.on { border-color: var(--text); }
.opt .rd { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--pad2); display: grid; place-items: center; }
.opt.on .rd { border-color: var(--text); }
.opt.on .rd::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--text); }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }

/* detail */
.dt-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.hist { display: grid; gap: 4px; margin-top: 8px; }
.hr { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--card); font-size: 13.5px; align-items: center; }
.hr span:first-child { color: var(--muted); }
.hr b { font: 700 17px var(--display); }
.wlist { display: flex; flex-wrap: wrap; gap: 6px; }
.wlist span { font: 600 14px var(--display); padding: 4px 9px; border-radius: 8px; background: var(--card); color: var(--muted); }

/* summary */
.sum-hero { text-align: center; padding: 6px 0 4px; }
.sum-hero .big { font: 700 64px/1 var(--display); color: var(--good); }
.sum-hero p { color: var(--muted); margin: 6px 0 0; }
.prs { display: grid; gap: 6px; margin-top: 14px; }
.toast { position: fixed; left: 50%; top: calc(14px + var(--sat)); transform: translate(-50%, -140%); z-index: 90; background: var(--text); color: #111; padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14.5px; box-shadow: 0 14px 40px rgba(0, 0, 0, .45); transition: transform .45s var(--spring); max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); }
.confetti { position: fixed; top: 38%; left: 50%; width: 9px; height: 14px; border-radius: 2px; z-index: 95; pointer-events: none; animation: conf 1.4s cubic-bezier(.15, .7, .35, 1) forwards; }
@keyframes conf { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

/* figure */
.fig { width: 100%; height: auto; display: block; }
.fig .fl { stroke: var(--line); stroke-width: 2; }
.fig .lb { fill: none; stroke: var(--fig); stroke-width: 8.5; stroke-linecap: round; stroke-linejoin: round; }
.fig .lb.far, .fig .ft.far { stroke: var(--fig2); }
.fig .ft { stroke: var(--fig); stroke-width: 6; stroke-linecap: round; }
.fig .tr { fill: none; stroke: var(--fig); stroke-width: 15; stroke-linecap: round; }
.fig .trf { fill: var(--fig); stroke: var(--fig); stroke-width: 8; stroke-linejoin: round; }
.fig .nk { stroke: var(--fig); stroke-width: 7; }
.fig .hd { fill: var(--fig); }
.fig .hi { stroke: var(--accent); stroke-linecap: round; opacity: .92; }
.fig circle.hi { fill: var(--accent); stroke: none; }
.fig .eq { stroke: var(--steel); stroke-linecap: round; }
.fig .pad { stroke: var(--pad); stroke-linecap: round; }
.fig .padf { fill: var(--pad); }
.fig .padc { stroke: var(--pad2); stroke-linecap: round; opacity: .92; }
.fig .roll { fill: var(--pad2); }
.fig .box, .fig .wall { fill: var(--pad); }
.fig .stk { fill: #2b3038; }
.fig .stkl { stroke: #4a525e; stroke-width: 3; }
.fig .lev { stroke: var(--steel); stroke-width: 3; opacity: .7; stroke-linecap: round; }
.fig .pul { fill: var(--bg2); stroke: var(--steel); stroke-width: 2; }
.fig .cb { stroke: var(--steel2); stroke-width: 1.6; }
.fig .hdl { fill: var(--steel); }
.fig .hdlb { stroke: var(--steel); stroke-width: 4; stroke-linecap: round; }
.fig .rope { stroke: #c9a86a; stroke-linecap: round; }
.fig .dbh { stroke: #6c7480; stroke-width: 3; }
.fig .dbp { stroke: var(--steel); stroke-width: 6; stroke-linecap: round; }
.fig .dbp.far { stroke: #5c636e; }
.fig .plate { fill: #22262c; stroke: var(--p25); stroke-width: 3; }
.fig .hub { fill: var(--steel); }
.fig .platef { stroke: var(--p25); stroke-linecap: round; }
.fig .platef2 { stroke: var(--p20); stroke-linecap: round; }
.fig .bar { stroke: var(--steel); stroke-width: 3; stroke-linecap: round; fill: none; }
.fig .platee { stroke: var(--p20); stroke-linecap: round; }
.fig .sled { stroke: var(--steel); stroke-linecap: round; }
.fig .ball { fill: var(--p20); opacity: .85; }
.fig .wheel { fill: none; stroke: var(--steel); stroke-width: 4; }
.fig .crank { fill: none; stroke: var(--steel); stroke-width: 2.5; }
.fig .belt { stroke: #30353d; stroke-linecap: round; }
.fig .turf { stroke: var(--p10); opacity: .6; }
.fig .ladder { stroke: var(--p15); }
.fig .stairs { fill: none; stroke: var(--steel); stroke-width: 4; stroke-linejoin: round; }
.fig .brope { fill: none; stroke: #c9a86a; stroke-width: 3; stroke-linecap: round; }
.fig .jrope { fill: none; stroke: #c9a86a; stroke-width: 2; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
@media (min-width: 560px) {
  #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

</style>

<body>
<div id="app">
  <main id="view" class="enter"></main>
  <nav class="tabs" aria-label="Navegação principal"></nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ============ Motor de animação dos exercícios ============ */
const Anim = (() => {
  const T = 46, UA = 27, FA = 25, TH = 38, SH = 38, FT = 12, CX = 120, FL = 188;
  const R = Math.PI / 180;
  const dir = a => [Math.sin(a * R), Math.cos(a * R)];
  const dirm = (a, m) => [m * Math.sin(a * R), Math.cos(a * R)];
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const lerp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  const hyp = v => Math.hypot(v[0], v[1]);
  const nrm = v => { const l = hyp(v) || 1; return [v[0] / l, v[1] / l]; };
  const angOf = v => Math.atan2(v[0], v[1]) / R;
  const f1 = n => Math.round(n * 10) / 10;
  const P2 = p => f1(p[0]) + ',' + f1(p[1]);

  /* ---------- primitives ---------- */
  const ln = (a, b, c, w) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${c}"${w ? ` stroke-width="${w}"` : ''}/>`;
  const pl = (pts, c) => `<polyline points="${pts.map(P2).join(' ')}" class="${c}"/>`;
  const ci = (p, r, c) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" class="${c}"/>`;
  const G = {
    ln: (a, b, c = 'eq', w) => ln(a, b, c, w),
    pad: (a, b, w = 8) => ln(a, b, 'pad', w),
    bench: (x1, x2, y) => ln([x1, y], [x2, y], 'pad', 7) + ln([x1 + 8, y + 4], [x1 + 8, FL], 'eq', 3) + ln([x2 - 8, y + 4], [x2 - 8, FL], 'eq', 3),
    seat: (j, ext = 22) => { const y = j.H[1] + 9; return ln([j.H[0] - 14, y], [j.H[0] + ext, y], 'pad', 7) + ln([j.H[0] + 2, y + 4], [j.H[0] + 2, FL], 'eq', 3); },
    back: (j, lo = -6, hi = 6, off = 9) => ln(add(add(j.H, j.u, lo), j.back, off), add(add(j.N, j.u, hi), j.back, off), 'pad', 7),
    post: (x, y1, y2 = FL) => ln([x, y1], [x, y2], 'eq', 4),
    rect: (x, y, w, h, c = 'padf', rx = 2) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" class="${c}"/>`,
    roller: (p, r = 5.5) => ci(p, r, 'roll'),
    box: (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="box"/>`,
    wall: (x) => `<rect x="${x}" y="14" width="8" height="${FL - 14}" class="wall"/>`,
    stack: (x = 6) => `<rect x="${x}" y="46" width="16" height="${FL - 46}" rx="3" class="stk"/>` + [0, 1, 2, 3, 4, 5, 6, 7].map(i => ln([x + 2, 120 + i * 8], [x + 14, 120 + i * 8], 'stkl')).join('')
  };
  function benchUnder(j, lo = -12, hi = 18, off = 10) {
    const a = add(add(j.H, j.u, lo), j.back, off), b = add(add(j.N, j.u, hi), j.back, off);
    const p1 = lerp(a, b, .15), p2 = lerp(a, b, .85);
    return G.pad(a, b, 7) + ln(p1, [p1[0], FL], 'eq', 3) + ln(p2, [p2[0], FL], 'eq', 3);
  }

  /* ---------- IK ---------- */

/* ---------- sheets ---------- */
const SHEETS = [];

/* ============ Views ============ */

/* ---------- Hoje ---------- */

  else if (!s && p === 'free') title = 'Dia livre';
  let h = `<header class="hd"><div><div class="eyebrow">${WD[d.getDay()]} · ${d.getDate()} de ${MONTHS[d.getMonth()]}</div><h1 class="title">${esc(title)}</h1>${syncBadge()}</div><button class="icon-btn tap" data-a="settings" aria-label="Ajustes">${I.gear}</button></header>`;
  h += weekStrip();
  h += dayCard(UI.sel);

  if (sg.length) h += `<h2 class="sec">Hora de subir a carga <small>2+ semanas no mesmo peso</small></h2>` + sg.map(sugRow).join('');

/* ---------- Agenda ---------- */
function vCal() {
  const [y, m] = UI.calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), t = todayISO();
  let h = `<header class="hd"><div><div class="eyebrow">Agenda</div><h1 class="title">Calendário de treinos</h1></div></header>`;
  h += `<div class="cal-h"><button class="icon-btn tap" data-a="calNav" data-v="-1" aria-label="Mês anterior">${I.chevL}</button><h3>${MONTHS[m - 1]} ${y}</h3><button class="icon-btn tap" data-a="calNav" data-v="1" aria-label="Próximo mês">${I.chevR}</button></div>`;
  h += '<div class="cal">' + ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(x => `<span class="cw">${x}</span>`).join('');
  let ds = weekStart(iso(first));
  for (let i = 0; i < 42; i++, ds = addDays(ds, 1)) {
    const dd = parse(ds); if (i >= 35 && dd.getMonth() !== m - 1) break;
    const s = getSession(ds), p = planFor(ds), w = wById(p);
    let cls = 'cd tap', mark = '', c = '';
    if (dd.getMonth() !== m - 1) cls += ' out';
    if (ds === t) cls += ' today';
    if (s) { c = s.color; mark = '<span class="bar"></span>'; if (s.end) cls += ' done'; }
    else if (w) { c = w.color; mark = '<span class="bar"></span>'; if (ds < t) cls += ' miss'; }
    else if (p === 'rest') mark = I.moon.replace('class="i"', 'class="i moon"');
    else mark = '<span style="height:7px"></span>';
    h += `<button class="${cls}" style="--c:${c || 'transparent'}" data-a="dayPlan" data-d="${ds}" aria-label="${fmtLong(ds)}"><span class="n">${dd.getDate()}</span>${mark}</button>`;
  }
  h += '</div><div class="legend"><span><i style="background:var(--text)"></i>feito</span><span><i style="opacity:.5"></i>planejado</span><span><i style="background:none;border:1.5px solid var(--muted)"></i>não registrado</span><span>' + I.moon.replace('class="i"', 'class="i" style="width:13px;height:13px;color:var(--rest)"') + 'descanso</span></div>';
  h += `<h2 class="sec">Plano da semana <small>toque para mudar</small></h2><div class="wk">`;
  for (const wd of [1, 2, 3, 4, 5, 6, 0]) {
    const v = CFG.week[wd] ?? 'free', w = wById(v);
    const val = w ? `<span class="wk-v" style="--c:${w.color}"><i class="dot"></i><span>${esc(w.name)}</span></span>` : v === 'rest' ? `<span class="wk-v rest">${I.moon}<span>Descanso</span></span>` : `<span class="wk-v free"><span>Livre</span></span>`;
    h += `<button class="wk-row tap" data-a="weekPick" data-wd="${wd}"><b>${WD3[wd]}</b>${val}${I.chevR}</button>`;
  }
  return h + '</div>';

  h += `<h2 class="sec">Treinos por semana <small>últimas 8 semanas</small></h2>` + freqChart();

function openSummary(ds) {

    else if (last != null && top > last) prs.push({ e, txt: `Subiu de ${fmtW(last)} para ${fmtW(top)} kg`, ic: I.up });

    if (!x.done && WEIGHTS[e.eq] && x.w == null) { openWeightPicker(i, j); toast('Escolha o peso desta série'); return; }
    x.done = !x.done; putSession(s); buzz(x.done ? 14 : 6);
    t.classList.toggle('on', x.done); t.classList.add('pop'); t.closest('.set').classList.toggle('done', x.done);
    setTimeout(() => refreshSets(i), 380);
    if (x.done) {
      const all = it.sets.every(z => z.done);
      if (!all) startRest(CFG.settings.rest);
      else {
        UI.rest = null; tickTimers();
        setTimeout(() => {
          UI.open[i] = false; const nx = s.items.findIndex((z, k) => k > i && !z.sets.every(q => q.done));
          if (nx >= 0) UI.open[nx] = true;
          renderSession();
          if (nx >= 0) setTimeout(() => { const c = $('#xc-' + nx); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
          else if (s.items.every(z => z.sets.every(q => q.done))) toast('Musculação completa! Adicione aeróbico ou finalize.');
        }, 700);
      }
    }
    updProg();
  },
  addSet: t => { const s = curS(), i = +t.dataset.i, it = s.items[i], l = it.sets[it.sets.length - 1]; it.sets.push({ w: l ? l.w : null, r: l ? l.r : 10, done: false }); putSession(s); refreshSets(i); buzz(6); },
  delSet: t => { const s = curS(), i = +t.dataset.i, it = s.items[i]; if (it.sets.length <= 1) return; it.sets.pop(); putSession(s); refreshSets(i); buzz(6); },
  rmItem: t => { const i = +t.dataset.i; confirmSheet({ title: 'Remover exercício?', text: 'Ele sai só do treino de hoje. O treino montado continua igual.', ok: 'Remover', danger: true, onOk: () => { const s = curS(); s.items.splice(i, 1); UI.open = {}; putSession(s); renderSession(); } }); },
  applySug: t => { const s = curS(), i = +t.dataset.i, it = s.items[i], g = suggest(it.ex, s.date, true); if (!g) return; it.sets.forEach(x => { if (!x.done) x.w = g.to; }); putSession(s); const b = t.closest('.banner'); if (b) b.remove(); refreshSets(i); toast(`Carga ajustada para ${fmtW(g.to)} kg`); buzz(12); },
  addEx: () => { if (topSheet('menu')) closeSheet(topSheet('menu')); openPicker({ title: 'Adicionar exercícios', only: STRENGTH_GROUPS.map(g => g.id), onDone: ids => { const s = curS(); const n0 = s.items.length; ids.forEach(id => addToSession(s, id)); putSession(s); UI.open = { [n0]: true }; renderSession(); setTimeout(() => { const c = $('#xc-' + n0); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200); } }); },
  addCardio: () => { if (topSheet('menu')) closeSheet(topSheet('menu')); openPicker({ title: 'Aeróbico', only: ['cardio'], preset: 'cardio', onDone: ids => { const s = curS(); ids.forEach(id => addToSession(s, id)); putSession(s); renderSession(); } }); },
  addStretch: () => { if (topSheet('menu')) closeSheet(topSheet('menu')); openPicker({ title: 'Alongamento', only: ['alongamento'], preset: 'alongamento', onDone: ids => { const s = curS(); ids.forEach(id => addToSession(s, id)); putSession(s); renderSession(); } }); },
  cMin: t => { const s = curS(), c = s.cardio[+t.dataset.i]; c.min = clamp((+c.min || 0) + (+t.dataset.v), 5, 240); putSession(s); replaceEl('cc-' + t.dataset.i, ccHTML(s, +t.dataset.i)); buzz(4); },
  cLvl: t => { const s = curS(), c = s.cardio[+t.dataset.i]; c.lvl = t.dataset.v; putSession(s); replaceEl('cc-' + t.dataset.i, ccHTML(s, +t.dataset.i)); buzz(4); },
  cDone: t => { const s = curS(), c = s.cardio[+t.dataset.i]; c.done = !c.done; putSession(s); t.classList.toggle('on', c.done); t.classList.add('pop'); t.closest('.cc').classList.toggle('done', c.done); updProg(); buzz(12); },
  cDel: t => { const s = curS(); s.cardio.splice(+t.dataset.i, 1); putSession(s); renderSession(); },
  sSec: t => { const s = curS(), c = s.stretch[+t.dataset.i]; c.sec = clamp((+c.sec || 0) + (+t.dataset.v), 15, 180); putSession(s); replaceEl('st-' + t.dataset.i, stHTML(s, +t.dataset.i)); buzz(4); },
  sHold: t => { ensureAudio(); const s = curS(), i = +t.dataset.i; if (UI.holds[i]) delete UI.holds[i]; else UI.holds[i] = { end: Date.now() + s.stretch[i].sec * 1000, total: s.stretch[i].sec }; replaceEl('st-' + i, stHTML(s, i)); buzz(8); },
  sDone: t => { const s = curS(), i = +t.dataset.i; delete UI.holds[i]; s.stretch[i].done = !s.stretch[i].done; putSession(s); replaceEl('st-' + i, stHTML(s, i)); updProg(); buzz(12); },
  sDel: t => { const s = curS(); s.stretch.splice(+t.dataset.i, 1); UI.holds = {}; putSession(s); renderSession(); },
  restAdd: () => { if (UI.rest) { UI.rest.end += 15000; tickTimers(); buzz(5); } },
  restSkip: () => { UI.rest = null; tickTimers(); buzz(5); },

  // seletor de peso
  wpStep: t => WP && wpSet(WP.k + (+t.dataset.v)),
  wpK: t => wpSet(+t.dataset.k),
  wpOne: () => wpApply(false),
  wpAll: () => wpApply(true),

  // seletor de exercícios
  pkG: t => { PK.g = t.dataset.g; $('#pk-g').innerHTML = groupChips(PK.g, 'pkG', PK.only); pkRefresh(); },
  pkToggle: t => { const id = t.dataset.id, n = PK.sel.indexOf(id); if (n >= 0) PK.sel.splice(n, 1); else PK.sel.push(id); buzz(6); pkRefresh(); },
  pkDone: () => { if (!PK || !PK.sel.length) return; const ids = PK.sel.slice(), f = PK.onDone; closeSheet(topSheet('pk')); f(ids); buzz(10); },

  // editor
  edColor: t => { ED.color = t.dataset.c; $('#ed-c').innerHTML = edColors(); buzz(5); },
  edGroup: t => { const g = t.dataset.g, n = ED.groups.indexOf(g); if (n >= 0) ED.groups.splice(n, 1); else ED.groups.push(g); $('#ed-g').innerHTML = edGroups(); buzz(5); },
  edRow: t => { const i = +t.dataset.i; ED.openRow = ED.openRow === i ? -1 : i; edRefresh(); },
  edMove: t => { const i = +t.dataset.i, j = i + (+t.dataset.v); if (j < 0 || j >= ED.items.length) return; [ED.items[i], ED.items[j]] = [ED.items[j], ED.items[i]]; ED.openRow = ED.openRow === i ? j : ED.openRow === j ? i : ED.openRow; edRefresh(); buzz(6); },
  edDel: t => { ED.items.splice(+t.dataset.i, 1); ED.openRow = -1; edRefresh(); buzz(6); },
  edSets: t => { const it = ED.items[+t.dataset.i]; it.sets = clamp((+it.sets || 3) + (+t.dataset.v), 1, 12); edRefresh(); buzz(4); },
  edAdd: () => openPicker({ title: 'Escolha os exercícios', preset: ED.groups.length === 1 ? ED.groups[0] : 'all', cta: 'Adicionar', onDone: ids => { ids.forEach(id => { const e = EXI[id]; ED.items.push({ ex: id, sets: e.eq === 'cardio' || e.eq === 'stretch' ? 1 : 3, reps: e.unit === 's' ? '30' : e.unit === 'm' ? '20' : '10' }); if (!ED.groups.includes(e.group) && STRENGTH_GROUPS.some(g => g.id === e.group)) ED.groups.push(e.group); }); $('#ed-g').innerHTML = edGroups(); edRefresh(); } }),
  edSave: () => { const w = edCommit(); closeSheet(topSheet('ed')); render(true); toast(`“${w.name}” salvo`); buzz(12); },
  edStart: () => { const w = edCommit(); const ds = todayISO(); closeSheet(topSheet('ed')); const s = getSession(ds); if (s && (s.items.length || s.cardio.length)) { openSession(ds); toast('Já existe um treino hoje — abri ele para você.'); return; } if (s) delSession(ds); startSession(ds, w.id); },
  edDelete: () => confirmSheet({ title: 'Excluir treino?', text: 'Os registros dos dias já treinados continuam salvos. Dias da semana com este treino passam a ficar livres.', ok: 'Excluir', danger: true, onOk: () => { const id = ED && ED.id; CFG.workouts = CFG.workouts.filter(w => w.id !== id); for (const k in CFG.week) if (CFG.week[k] === id) CFG.week[k] = 'free'; for (const k in CFG.overrides) if (CFG.overrides[k] === id) delete CFG.overrides[k]; saveCfg(); closeSheet(topSheet('ed')); render(true); toast('Treino excluído'); } }),

  // ajustes
  restStep: t => { CFG.settings.rest = clamp(CFG.settings.rest + (+t.dataset.v), 15, 600); saveCfg(); $('#rest-def').textContent = fmtDur(CFG.settings.rest * 1000); buzz(4); },
  copyBackup: async () => { const txt = JSON.stringify({ app: 'treino-academia', v: 1, cfg: CFG, md: MD }); try { await navigator.clipboard.writeText(txt); toast('Backup copiado. Guarde em uma nota.'); } catch (e) { const ta = $('#bk'); if (ta) { ta.value = txt; ta.select(); } toast('Copie o texto que apareceu no campo abaixo.'); } },
  restoreBackup: () => { const ta = $('#bk'); let o; try { o = JSON.parse(ta.value); } catch (e) { toast('Esse texto não é um backup válido.'); return; } if (!o || !o.cfg) { toast('Esse texto não é um backup válido.'); return; } confirmSheet({ title: 'Restaurar backup?', text: 'Os dados atuais serão substituídos pelos do backup.', ok: 'Restaurar', onOk: () => { CFG = fixCfg(o.cfg); MD = o.md || {}; CFG.u = Date.now(); for (const k in MD) MD[k].u = Date.now(); bump(); Store.mark('config'); for (const k in MD) Store.mark(k); while (SHEETS.length) closeSheet(); render(); toast('Backup restaurado'); } }); },
  resetAll: () => confirmSheet({ title: 'Apagar tudo?', text: 'Treinos montados, agenda e todo o histórico de pesos serão apagados. Não dá para desfazer.', ok: 'Apagar tudo', danger: true, onOk: () => { const keep = Object.keys(MD); CFG = defaultCfg(); CFG.u = Date.now(); MD = {}; for (const k of keep) MD[k] = { s: {}, u: Date.now() }; bump(); Store.mark('config'); for (const k of keep) Store.mark(k); while (SHEETS.length) closeSheet(); render(); toast('Tudo apagado'); } })
};
const INP = {
  libQ: t => { UI.libQ = t.value; $('#lib-list').innerHTML = libList(); hydrate($('#lib-list')); },
  pkQ: t => { if (PK) { PK.q = t.value; pkRefresh(); } },
  edName: t => { if (ED) ED.name = t.value; },
  edReps: t => { if (ED) ED.items[+t.dataset.i].reps = t.value.replace(/[^0-9\-–]/g, '').slice(0, 7); },
  setName: t => { CFG.name = t.value.trim(); saveCfg(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.a]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.in && INP[t.dataset.in]) INP[t.dataset.in](t, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (SHEETS.length) closeSheet(); else if (UI.sess) closeSession(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickTimers(); if (!UI.sess && UI.tab === 'hoje') render(true); } });

/* ============ Início ============ */
function boot() {
  $('nav.tabs').innerHTML = [['hoje', 'Hoje', I.flame], ['agenda', 'Agenda', I.cal], ['treinos', 'Treinos', I.dumb], ['exercicios', 'Exercícios', I.list], ['evolucao', 'Evolução', I.chart]].map(([t, l, ic]) => `<button class="tab tap" data-a="tab" data-t="${t}">${ic}<span>${l}</span></button>`).join('');
  Store.loadLocal();
  CFG = fixCfg(CFG);
  const h = (location.hash || '').slice(1);
  if (['hoje', 'agenda', 'treinos', 'exercicios', 'evolucao'].includes(h)) UI.tab = h;
  bump(); render();
  const t = todayISO(), s = getSession(t);
  if (s && !s.end && Date.now() - s.start < 5 * 3600e3) { /* treino em andamento continua no card de hoje */ }
  Store.connect();
}
boot();

</script>
</body>
