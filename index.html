<title>GymApp</title>
<style>
/* Layout: one-column phone app, large iOS titles, floating glass tab bar; sheets rise from the bottom. Light, soft mesh background so the glass reads. */
:root {
  --bg: #f2f2f7;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --dim: #a1a1a6;
  --hair: rgba(60, 60, 67, .12);
  --hair2: rgba(60, 60, 67, .2);
  --fill: rgba(118, 118, 128, .12);
  --fill2: rgba(118, 118, 128, .2);
  --glass: rgba(255, 255, 255, .62);
  --glass2: rgba(255, 255, 255, .84);
  --gb: rgba(255, 255, 255, .85);
  --accent: #ff5e1a;
  --accent2: #ff8a3d;
  --blue: #007aff;
  --green: #34c759;
  --green-ink: #1a8f3c;
  --red: #ff3b30;
  --yellow: #ffcc00;
  --cardio: #007aff;
  --stretch: #34c759;
  --rest: #5856d6;
  --fig: #232326;
  --fig2: #a6a6ad;
  --steel: #8e8e93;
  --steel2: #636366;
  --pad: #d6d6dc;
  --pad2: #bcbcc4;
  --p25: #e5383b;
  --p20: #3a86ff;
  --p15: #f2c230;
  --p10: #2eb67d;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 10px 30px -10px rgba(30, 40, 80, .16);
  --shadow-lg: 0 2px 6px rgba(20, 24, 40, .06), 0 24px 60px -18px rgba(30, 40, 80, .3);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --title: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --round: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ios: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 17px/1.35 var(--font); letter-spacing: -.012em; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid rgba(0, 122, 255, .45); outline-offset: 2px; border-radius: 12px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num, .tile b, .wbtn, .step span { font-family: var(--round); font-variant-numeric: tabular-nums; }

/* fundo em malha suave */
.bgfx { position: fixed; inset: -25%; z-index: -1; pointer-events: none; background:
  radial-gradient(32% 28% at 18% 12%, rgba(255, 170, 120, .5), transparent 70%),
  radial-gradient(30% 26% at 86% 18%, rgba(120, 175, 255, .42), transparent 70%),
  radial-gradient(38% 34% at 74% 82%, rgba(140, 225, 185, .36), transparent 70%),
  radial-gradient(30% 28% at 12% 78%, rgba(200, 165, 255, .34), transparent 70%), var(--bg);
  }

/* vidro líquido */
.glass, .card, .tile, .daycard, .wcard, .sheet, nav.tabs, .ss-h, .lock-card, .chart, .seg2, .mini, .streak, .avatar { position: relative; }
.glass, .card, .tile, .daycard, .wcard, .chart, .lock-card {
  background: linear-gradient(150deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .5));
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--gb); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .9);
}
.shine::after, .glass::after, nav.tabs::after, .btn.primary::after, .lock-card::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(155deg, rgba(255, 255, 255, .75) 0%, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .35) 100%);
  mix-blend-mode: soft-light; }

#app { max-width: 540px; margin: 0 auto; min-height: 100%; position: relative; }
main#view { padding: calc(12px + var(--sat)) 18px calc(118px + var(--sab)); }
body.has-mini main#view { padding-bottom: calc(186px + var(--sab)); }

/* troca de abas: só um fade curto, sem deslocamento */
main#view.fade, main#view.enter { animation: fadeIn .16s ease-out both; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeQ { from { opacity: .25; } }
.stag > * { animation: rise .42s var(--ease) both; animation-delay: calc(var(--si, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* toque */
.tap { position: relative; overflow: hidden; transition: transform .5s var(--spring), background-color .25s, box-shadow .3s, opacity .2s, filter .2s; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.tap:active { transform: scale(.955); transition-duration: .12s; filter: brightness(.97); }
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, .35) 40%, rgba(255, 255, 255, 0) 70%); transform: scale(0); opacity: 1; animation: rip .7s var(--ease) forwards; mix-blend-mode: soft-light; }
.rip.dark { background: radial-gradient(circle, rgba(0, 0, 0, .12) 0%, rgba(0, 0, 0, 0) 65%); mix-blend-mode: normal; }
@keyframes rip { to { transform: scale(1); opacity: 0; } }

/* cabeçalho */
.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 18px; }
.eyebrow { font: 600 13px/1 var(--font); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
h1.title { font: 700 34px/1.08 var(--title); letter-spacing: -.025em; margin: 6px 0 0; text-wrap: balance; }
h2.sec { font: 700 22px/1.15 var(--title); letter-spacing: -.02em; margin: 28px 2px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h2.sec small { font: 400 14px var(--font); color: var(--muted); letter-spacing: -.01em; }
.hd-r { display: flex; align-items: center; gap: 8px; flex: none; padding-bottom: 2px; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass2); border: 1px solid var(--gb); box-shadow: var(--shadow); color: var(--text); flex: none; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.icon-btn svg.i { width: 20px; height: 20px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); color: #fff; font: 700 16px var(--round); box-shadow: 0 6px 16px -6px var(--c), inset 0 1px 0 rgba(255, 255, 255, .5); flex: none; text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.sync b { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
.sync.cloud b { background: var(--green); }
.sync.saving b { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* foguinho */
.streak { display: inline-flex; align-items: center; gap: 4px; height: 42px; padding: 0 13px 0 9px; border-radius: 21px; background: var(--glass2); border: 1px solid var(--gb); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font: 700 18px var(--round); color: #e8590c; }
.streak.off { color: var(--muted); }
.flame { width: 26px; height: 26px; display: block; overflow: visible; }
.flame .fo { transform-origin: 50% 92%; animation: flick 1.7s ease-in-out infinite; }
.flame .fi { transform-origin: 50% 95%; animation: flick2 1.2s ease-in-out infinite; }
.off .flame, .flame.off { filter: grayscale(1) opacity(.45); }
.off .flame .fo, .off .flame .fi, .flame.off .fo, .flame.off .fi { animation: none; }
@keyframes flick { 0%, 100% { transform: scale(1, 1) skewX(0); } 30% { transform: scale(.97, 1.05) skewX(-2deg); } 65% { transform: scale(1.02, .97) skewX(2deg); } }
@keyframes flick2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(.9, 1.1); } }

/* barra de abas flutuante */
nav.tabs { position: fixed; left: 50%; bottom: calc(10px + var(--sab)); transform: translateX(-50%); width: calc(100% - 24px); max-width: 500px; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 34px;
  background: linear-gradient(150deg, rgba(255, 255, 255, .72), rgba(255, 255, 255, .45)); -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%);
  border: 1px solid var(--gb); box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .4); }
.tab-pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 28px; background: rgba(255, 255, 255, .85); box-shadow: 0 4px 14px -4px rgba(30, 40, 80, .22), inset 0 1px 0 #fff; transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .3s var(--ease); }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 28px; color: var(--muted); font: 600 10.5px var(--font); letter-spacing: 0; }
.tab svg.i { width: 24px; height: 24px; transition: transform .25s var(--ease), color .15s; }
.tab.on { color: var(--accent); }
.tab.on svg.i { transform: scale(1.1); }
.tab.bounce svg.i { animation: tabb .3s var(--ease); }
.tab { transition: color .12s; }
.tab:active { transform: none; }
@keyframes tabb { 40% { transform: scale(.82); } }

/* chips e controles */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 4px 18px 8px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px; border-radius: 18px; background: var(--glass2); border: 1px solid var(--gb); color: var(--text); font: 600 14.5px var(--font); white-space: nowrap; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
.chip.on { background: var(--text); color: #fff; border-color: var(--text); }
.chip.sm { height: 28px; padding: 0 11px; font-size: 13px; font-weight: 500; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font: 600 12.5px var(--font); background: var(--fill); color: var(--muted); }
.seg2 { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); padding: 3px; border-radius: 12px; background: var(--fill); margin-bottom: 6px; }
.seg2 .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n, 2)); border-radius: 9px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .04); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .55s var(--spring); }
.seg2 button { position: relative; z-index: 1; height: 34px; font: 600 14px var(--font); color: var(--text); border-radius: 9px; }
.seg2.sm button { height: 28px; font-size: 13px; }

.btn { height: 52px; padding: 0 22px; border-radius: 26px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 17px var(--font); background: var(--glass2); border: 1px solid var(--gb); box-shadow: var(--shadow); color: var(--text); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.btn svg.i { width: 19px; height: 19px; }
.btn.primary { background: linear-gradient(180deg, #ff7a3a, #ff5414); color: #fff; border-color: rgba(255, 255, 255, .35); box-shadow: 0 10px 26px -10px rgba(255, 84, 20, .75), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.primary:disabled { opacity: .45; box-shadow: none; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--blue); }
.btn.block { width: 100%; }
.btn.sm { height: 42px; font-size: 15px; padding: 0 16px; border-radius: 21px; }
.btn.danger { color: var(--red); }
.link { color: var(--blue); font-weight: 500; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; font-size: 15.5px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .sw { width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; transition: background .3s; flex: none; }
.toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .1); transition: transform .45s var(--spring); }
.toggle input:checked + .sw { background: var(--green); }
.toggle input:checked + .sw::after { transform: translateX(20px); }

/* semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 9px; border-radius: 18px; background: var(--glass); border: 1px solid var(--gb); box-shadow: 0 1px 2px rgba(0, 0, 0, .03); }
.wd-l { font: 600 11px var(--font); color: var(--muted); }
.wd-n { font: 600 20px/1 var(--round); }
.wd-dot { width: 20px; height: 20px; display: grid; place-items: center; }
.wd-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: block; }
.wd-dot .moon { width: 14px; height: 14px; color: var(--rest); stroke-width: 2.2; }
.wd-dot .flame { width: 20px; height: 20px; }
.wd.today { background: var(--glass2); }
.wd.today .wd-n { color: var(--accent); }
.wd.sel { background: var(--text); color: #fff; border-color: var(--text); box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .5); }
.wd.sel .wd-l { color: rgba(255, 255, 255, .65); }
.wd.sel.today .wd-n { color: var(--accent2); }

/* card do dia */
.daycard { margin-top: 14px; border-radius: 28px; overflow: hidden; }
.daycard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 70% at 100% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 60%); pointer-events: none; }
.dc-in { position: relative; padding: 18px 18px 18px; }
.dc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dc-title { font: 700 28px/1.08 var(--title); letter-spacing: -.025em; margin: 12px 0 8px; text-wrap: balance; }
.dc-meta { color: var(--muted); font-size: 14.5px; }
.dc-list { margin: 12px 0 16px; display: grid; }
.dl { display: grid; grid-template-columns: 20px 50px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border-top: .5px solid var(--hair); }
.dl:first-child { border-top: 0; }
.dl-n { font: 600 15px var(--round); color: var(--dim); text-align: center; }
.th { width: 50px; height: 42px; border-radius: 12px; background: linear-gradient(180deg, #fbfbfd, #eceef3); display: block; overflow: hidden; border: .5px solid var(--hair); }
.th svg { width: 100%; height: 100%; }
.dl-t { font-size: 15px; line-height: 1.22; }
.dl-t small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.dl-w { font: 600 15px var(--round); color: var(--muted); text-align: right; white-space: nowrap; }
.dc-actions { display: flex; gap: 10px; }
.dc-actions .btn.primary { flex: 1; }
.rest-hero { display: grid; place-items: center; text-align: center; padding: 22px 10px 6px; }
.rest-hero svg.i { width: 52px; height: 52px; color: var(--rest); stroke-width: 1.5; }
.rest-hero h3 { font: 700 26px var(--title); letter-spacing: -.02em; margin: 10px 0 4px; }
.rest-hero p { color: var(--muted); margin: 0 0 16px; font-size: 15px; max-width: 30ch; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qbtn { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 20px; background: var(--glass2); border: 1px solid var(--gb); text-align: left; font-weight: 600; font-size: 15px; box-shadow: var(--shadow); }
.qbtn svg.i { color: var(--c); }

/* blocos */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border-radius: 22px; padding: 13px 13px 12px; overflow: hidden; }
.tile b { display: flex; align-items: baseline; gap: 3px; font-size: 27px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
.tile b small { font-size: 15px; color: var(--muted); font-weight: 600; }
.tile > span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 5px; line-height: 1.2; }
.tile .flame { width: 24px; height: 24px; margin-right: 2px; }

/* sugestão */
.sug { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; background: var(--glass); border: 1px solid var(--gb); border-radius: 22px; margin-bottom: 8px; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(0, 0, 0, .03); }
.sug-t { font-size: 15px; line-height: 1.25; }
.sug-t small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.upchip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 16px; background: rgba(52, 199, 89, .15); color: var(--green-ink); font: 700 16px var(--round); white-space: nowrap; }
.upchip svg.i { width: 15px; height: 15px; stroke-width: 2.6; }
.banner { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; border-radius: 20px; background: linear-gradient(150deg, rgba(52, 199, 89, .16), rgba(52, 199, 89, .08)); border: 1px solid rgba(52, 199, 89, .3); color: #145c29; font-size: 14.5px; line-height: 1.3; margin-bottom: 12px; }
.banner svg.i { color: var(--green-ink); }
.banner.blue { background: linear-gradient(150deg, rgba(0, 122, 255, .14), rgba(0, 122, 255, .06)); border-color: rgba(0, 122, 255, .25); color: #0a3f80; }
.banner.blue svg.i { color: var(--blue); }
.banner .btn { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 18px; background: var(--green); color: #fff; border: 0; flex: none; box-shadow: none; }
.banner.blue .btn { background: var(--blue); }
.empty { text-align: center; color: var(--muted); padding: 22px 14px; background: var(--glass); border: 1px dashed var(--hair2); border-radius: 22px; font-size: 15px; line-height: 1.4; }

/* calendário */
.cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-h h3 { font: 700 22px var(--title); letter-spacing: -.02em; margin: 0; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 12px 10px; border-radius: 26px; }
.cal .cw { text-align: center; font: 600 11.5px var(--font); color: var(--muted); padding: 2px 0 6px; }
.cd { aspect-ratio: 1 / 1.1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0 6px; }
.cd.out { opacity: .32; }
.cd .n { font: 500 17px/1 var(--round); }
.cd.today { background: rgba(255, 94, 26, .12); }
.cd.today .n { color: var(--accent); font-weight: 700; }
.cd .bar { width: 60%; height: 5px; border-radius: 3px; background: var(--c); opacity: .45; }
.cd.done .bar { opacity: 1; height: 6px; }
.cd.miss .bar { background: transparent; border: 1.5px solid var(--c); opacity: .7; }
.cd .moon { width: 13px; height: 13px; color: var(--rest); }
.cd.done { background: var(--fill); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin: 10px 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 5px; border-radius: 3px; background: var(--muted); display: inline-block; }
.list { border-radius: 24px; overflow: hidden; background: var(--glass); border: 1px solid var(--gb); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); }
.wk-row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 14px 14px 14px 16px; text-align: left; width: 100%; border-top: .5px solid var(--hair); }
.wk-row:first-child { border-top: 0; }
.wk-row b { font: 600 16px var(--font); }
.wk-v { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15.5px; min-width: 0; }
.wk-v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-v .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.wk-row > svg.i { color: var(--dim); width: 18px; height: 18px; }
.wk-v.rest { color: var(--rest); }
.wk-v.rest svg.i { width: 17px; height: 17px; }
.wk-v.free { color: var(--muted); }

/* treinos */
.wcard { display: block; width: 100%; text-align: left; border-radius: 26px; padding: 18px 18px 16px; margin-bottom: 12px; overflow: hidden; }
.wcard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 80% at 100% 0%, color-mix(in srgb, var(--c) 20%, transparent), transparent 60%); pointer-events: none; }
.wcard > * { position: relative; }
.wcard .wdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 8px; vertical-align: 3px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
.wcard h3 { font: 700 23px/1.1 var(--title); letter-spacing: -.02em; margin: 0 0 6px; }
.wcard p { margin: 0; color: var(--muted); font-size: 14.5px; }
.wthumbs { display: flex; gap: 6px; margin-top: 12px; overflow: hidden; }
.wthumbs .th { width: 54px; height: 46px; flex: none; }
.wthumbs .more { width: 46px; height: 46px; border-radius: 12px; background: var(--fill); display: grid; place-items: center; color: var(--muted); font: 600 15px var(--round); flex: none; }
.days-of { display: flex; gap: 4px; margin-top: 12px; }
.days-of span { font: 600 12px var(--round); width: 28px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--fill); color: var(--dim); }
.days-of span.on { background: var(--c); color: #fff; }

/* biblioteca */
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 14px; background: var(--fill); margin-bottom: 12px; }
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 17px; min-width: 0; }
.search svg.i { color: var(--muted); width: 19px; height: 19px; }
.lib-sub { font: 600 13px var(--font); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); margin: 20px 6px 8px; }
.li { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 20px; background: rgba(255, 255, 255, .7); border: 1px solid rgba(255, 255, 255, .9); margin-bottom: 7px; box-shadow: 0 1px 2px rgba(0, 0, 0, .03); }
.li .th { width: 60px; height: 50px; }
.li-t { font-size: 15.5px; line-height: 1.25; }
.li-t small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.li-r { color: var(--dim); }
.li-r svg.i { width: 18px; height: 18px; }
.li .ck { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--hair2); display: grid; place-items: center; transition: background .25s, border-color .25s, transform .4s var(--spring); }
.li .ck svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; transform: scale(.4); transition: all .35s var(--spring); }
.li.on { border-color: rgba(255, 94, 26, .5); background: rgba(255, 255, 255, .9); }
.li.on .ck { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.li.on .ck svg { opacity: 1; transform: none; }

/* gráficos */
.chart { border-radius: 24px; padding: 14px 12px 8px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ax { font: 500 10.5px var(--font); fill: var(--dim); }
.chart .gl { stroke: var(--hair); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--lc, var(--accent)); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); animation: draw 1.1s var(--ease) .1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .ar { opacity: 0; animation: fadein .9s var(--ease) .35s forwards; }
@keyframes fadein { to { opacity: 1; } }
.chart .pt { fill: #fff; stroke: var(--lc, var(--accent)); stroke-width: 2.2; }
.chart .pt.last { fill: var(--lc, var(--accent)); stroke: #fff; }
.chart .lb { font: 700 12px var(--round); fill: var(--text); }
.chart .br { fill: var(--accent); opacity: .85; transform-origin: center bottom; transform-box: fill-box; animation: grow .8s var(--spring) both; }
.chart .br.cur { fill: var(--accent2); opacity: 1; }
@keyframes grow { from { transform: scaleY(0); } }
.chart-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 2px 4px 8px; }
.chart-h b { font: 700 30px/1 var(--round); letter-spacing: -.02em; }
.chart-h b small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.chart-h span { font-size: 13.5px; color: var(--muted); text-align: right; }
.pe { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-top: .5px solid var(--hair); }
.pe:first-child { border-top: 0; }
.pe-t { font-size: 15px; line-height: 1.22; min-width: 0; }
.pe-t small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.pe-r { text-align: right; }
.pe-r b { font: 700 18px var(--round); display: block; }
.pe-r small { font: 600 12.5px var(--font); }
.up { color: var(--green-ink); }
.down { color: var(--red); }
.spark { width: 64px; height: 22px; display: block; margin-left: auto; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hist { display: grid; }
.hr { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; padding: 11px 14px; font-size: 14px; align-items: center; border-top: .5px solid var(--hair); text-align: left; width: 100%; }
.hr:first-child { border-top: 0; }
.hr span:first-child { color: var(--muted); }
.hr b { font: 700 16px var(--round); }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { text-align: left; border-radius: 22px; padding: 13px 13px 10px; background: var(--glass); border: 1px solid var(--gb); box-shadow: 0 1px 2px rgba(0, 0, 0, .03); transition: transform .5s var(--spring), box-shadow .3s, background .3s; }
.metric.on { background: #fff; box-shadow: 0 0 0 2px var(--mc, var(--accent)), var(--shadow); }
.metric span { display: block; font-size: 13px; color: var(--muted); }
.metric b { display: block; font: 700 24px/1.1 var(--round); margin-top: 4px; letter-spacing: -.02em; }
.metric b small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.metric em { display: block; font: 600 12.5px var(--font); font-style: normal; margin-top: 2px; color: var(--muted); }
.metric .spark { width: 100%; height: 26px; margin-top: 6px; }
.metric .spark path { stroke: var(--mc, var(--accent)); }

/* folhas */
.scrim { position: fixed; inset: 0; background: rgba(20, 22, 30, .22); z-index: 50; opacity: 0; transition: opacity .45s var(--ios); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 51; width: 100%; max-width: 540px; max-height: calc(100% - 34px - var(--sat)); display: flex; flex-direction: column; border-radius: 34px 34px 0 0;
  background: linear-gradient(180deg, rgba(250, 250, 253, .9), rgba(242, 242, 247, .94)); -webkit-backdrop-filter: blur(36px) saturate(180%); backdrop-filter: blur(36px) saturate(180%);
  border: 1px solid var(--gb); border-bottom: 0; transform: translate(-50%, 105%); transition: transform .6s var(--ios); box-shadow: 0 -10px 50px rgba(30, 40, 80, .18), inset 0 1px 0 #fff; }
.sheet.on { transform: translate(-50%, 0); }
.sheet.full { height: calc(100% - 34px - var(--sat)); }
.sheet.drag { transition: none; }
.sh-h { flex: none; padding: 8px 18px 6px; touch-action: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--hair2); margin: 0 auto 12px; }
.sh-t { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sh-t h3 { font: 700 22px/1.12 var(--title); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sh-t .icon-btn { width: 32px; height: 32px; background: var(--fill); border: 0; box-shadow: none; color: var(--muted); }
.sh-t .icon-btn svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
.sh-sub { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
.sh-b { flex: 1; overflow-y: auto; padding: 8px 18px 18px; overscroll-behavior: contain; }
.sh-f { flex: none; padding: 10px 18px calc(14px + var(--sab)); display: flex; gap: 10px; }
.sh-f .btn { flex: 1; }
.sheet.shake { animation: shake .45s; }

/* sessão */
.sess { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); border-radius: 34px 34px 0 0; transition: transform .62s var(--ios), border-radius .62s var(--ios); max-width: 540px; margin: 0 auto; overflow: hidden; box-shadow: 0 -20px 60px rgba(30, 40, 80, .25); }
.sess.on { transform: none; border-radius: 0; }
.sess > .bgfx { position: absolute; }
.ss-h { flex: none; padding: calc(10px + var(--sat)) 14px 10px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .55)); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: .5px solid var(--hair); z-index: 2; }
.ss-ttl { text-align: center; min-width: 0; }
.ss-ttl b { display: block; font: 700 17px/1.15 var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-ttl span { font: 500 13.5px var(--round); color: var(--muted); font-variant-numeric: tabular-nums; }
.prog { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; margin: 8px 4px 0; grid-column: 1 / -1; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--accent)) 70%, #fff), var(--c, var(--accent))); border-radius: 2px; transition: width .8s var(--ease); }
.ss-b { flex: 1; overflow-y: auto; padding: 14px 14px calc(170px + var(--sab)); overscroll-behavior: contain; position: relative; z-index: 1; }
.ss-f { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px calc(14px + var(--sab)); background: linear-gradient(rgba(242, 242, 247, 0), rgba(242, 242, 247, .92) 38%); display: flex; gap: 10px; z-index: 3; }
.ss-f .btn.primary { flex: 1; }
.sec-l { display: flex; align-items: center; gap: 8px; font: 700 20px var(--title); letter-spacing: -.02em; margin: 24px 4px 10px; }
.sec-l svg.i { color: var(--c); }
.sec-l small { margin-left: auto; font: 400 14px var(--font); color: var(--muted); }

.xc { margin-bottom: 10px; border-radius: 26px; overflow: hidden; background: linear-gradient(150deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6)); border: 1px solid var(--gb); box-shadow: var(--shadow); transition: box-shadow .4s, transform .5s var(--spring); }
.xc.open { box-shadow: var(--shadow-lg); }
.xc.done { box-shadow: 0 0 0 1.5px rgba(52, 199, 89, .55), var(--shadow); }
.xc-h { display: grid; grid-template-columns: 30px 58px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 14px 10px 10px; }
.xc-n { width: 28px; height: 28px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font: 700 15px var(--round); transition: background .35s, color .35s, transform .5s var(--spring); }
.xc.done .xc-n { background: var(--green); color: #fff; transform: scale(1.06); }
.xc-h .th { width: 58px; height: 48px; }
.xc-t b { display: block; font-size: 15.5px; line-height: 1.22; font-weight: 600; }
.xc-t small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.xc-st { font: 600 16px var(--round); color: var(--muted); display: flex; align-items: center; gap: 4px; }
.xc-st svg.i { width: 18px; height: 18px; transition: transform .5s var(--spring); }
.xc.open .xc-st svg.i { transform: rotate(180deg); }
.xc-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s var(--ios); }
.xc.open .xc-b { grid-template-rows: 1fr; }
.xc-bi { overflow: hidden; }
.xc-bp { padding: 0 12px 12px; }
.xc.open .xc-bp > * { animation: rise .5s var(--ease) both; }
.xc.open .xc-bp > *:nth-child(2) { animation-delay: .04s; } .xc.open .xc-bp > *:nth-child(3) { animation-delay: .08s; } .xc.open .xc-bp > *:nth-child(4) { animation-delay: .12s; } .xc.open .xc-bp > *:nth-child(5) { animation-delay: .16s; }
.anim { border-radius: 20px; background: linear-gradient(180deg, #fcfcfe, #ebedf2); overflow: hidden; position: relative; border: .5px solid var(--hair); }
.anim svg { width: 100%; height: auto; display: block; }
.anim-in { width: 100%; height: 100%; }
.xc-bp > .anim { height: 190px; }
.sheet .sh-b > .anim { height: 240px; }
.xc-bp > .anim svg, .sheet .sh-b > .anim svg { height: 100%; }
.anim .mus { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.anim .mus span { font: 600 11.5px var(--font); padding: 3px 8px; border-radius: 10px; background: rgba(255, 255, 255, .8); color: #c2410c; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: .5px solid rgba(255, 94, 26, .25); }
.howto { margin: 8px 0 4px; }
.howto summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 500; font-size: 15px; padding: 6px 0; }
.howto summary svg.i { width: 18px; height: 18px; }
.howto summary::-webkit-details-marker { display: none; }
.howto ol { margin: 4px 0 6px; padding-left: 20px; color: #3a3a3c; font-size: 15px; line-height: 1.45; }
.howto[open] ol { animation: rise .45s var(--ease); }
.howto li { margin-bottom: 4px; }
.last { font-size: 14px; color: var(--muted); margin: 6px 2px 10px; }
.last b { color: var(--text); font-weight: 600; }
.sets { display: grid; gap: 6px; }
.set-h, .set { display: grid; grid-template-columns: 34px 1fr 124px 46px; align-items: center; gap: 8px; }
.set-h { font: 600 11px var(--font); text-transform: uppercase; color: var(--dim); padding: 0 6px; }
.set-h span:first-child, .set-h span:nth-child(3) { text-align: center; }
.set { background: rgba(118, 118, 128, .07); border-radius: 18px; padding: 6px; transition: background .45s var(--ease); }
.set.done { background: rgba(52, 199, 89, .14); }
.set-i { font: 700 17px var(--round); text-align: center; color: var(--muted); }
.wbtn { height: 46px; border-radius: 14px; background: #fff; border: .5px solid var(--hair); display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 22px; font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
.wbtn small { font: 600 12px var(--font); color: var(--muted); }
.wbtn em { font: 700 12.5px var(--round); font-style: normal; margin-left: 4px; }
.wbtn.empty { color: var(--blue); font: 600 15px var(--font); }
.step { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; height: 46px; background: #fff; border: .5px solid var(--hair); border-radius: 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
.step button { height: 100%; display: grid; place-items: center; color: var(--blue); border-radius: 12px; }
.step button svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.step span { text-align: center; font-size: 21px; font-weight: 700; }
.step span small { font: 600 11px var(--font); color: var(--muted); margin-left: 2px; }
.bump { animation: bump .45s var(--spring); }
@keyframes bump { 35% { transform: scale(1.25); } }
.chk { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--hair2); background: #fff; display: grid; place-items: center; transition: background .3s, border-color .3s, transform .5s var(--spring); }
.chk svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.chk svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .4s var(--ease) .08s; }
.chk.on { background: var(--green); border-color: var(--green); box-shadow: 0 6px 16px -6px rgba(52, 199, 89, .9); }
.chk.on svg path { stroke-dashoffset: 0; }
.chk.pop { animation: pop .55s var(--spring); }
@keyframes pop { 25% { transform: scale(.8); } 65% { transform: scale(1.14); } }
.burst { position: fixed; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 96; animation: burst .7s var(--ease) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.3); opacity: 0; } }
.xc-f { display: flex; gap: 8px; margin-top: 10px; }
.xc-f .btn { flex: 1; }
.addrow { display: flex; gap: 8px; margin-top: 4px; }
.addrow .btn { flex: 1; }

.cc { display: grid; grid-template-columns: 90px 1fr 46px; gap: 12px; align-items: center; border-radius: 24px; padding: 10px; margin-bottom: 8px; background: linear-gradient(150deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6)); border: 1px solid var(--gb); box-shadow: var(--shadow); position: relative; }
.cc.done { box-shadow: 0 0 0 1.5px rgba(52, 199, 89, .55), var(--shadow); }
.cc .anim { width: 90px; height: 76px; border-radius: 16px; }
.cc-t { min-width: 0; }
.cc-t b { display: block; font-size: 15px; line-height: 1.22; font-weight: 600; padding-right: 24px; }
.cc-c { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.cc .step { height: 38px; grid-template-columns: 32px 64px 32px; }
.cc .step span { font-size: 17px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 11px; padding: 2px; }
.seg button { height: 32px; padding: 0 9px; border-radius: 9px; font: 600 12.5px var(--font); color: var(--muted); transition: background .3s, color .3s, box-shadow .3s; }
.seg button.on { background: #fff; color: var(--text); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.cc .x { position: absolute; top: 8px; right: 62px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); background: var(--fill); }
.cc .x svg.i { width: 13px; height: 13px; stroke-width: 2.8; }
.ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--stretch) calc(var(--p, 0) * 1turn), var(--fill2) 0); position: relative; color: var(--stretch); }
.ring::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
.ring svg.i, .ring span { position: relative; z-index: 1; width: 18px; height: 18px; }
.ring span { width: auto; height: auto; font: 700 15px var(--round); color: var(--text); }

.restpill { position: absolute; left: 50%; bottom: calc(88px + var(--sab)); transform: translate(-50%, 30px) scale(.9); opacity: 0; pointer-events: none; z-index: 45; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 18px; border-radius: 30px; background: rgba(28, 28, 30, .86); color: #fff; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .45); transition: all .6s var(--spring); }
.restpill.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.restpill b { font: 700 24px var(--round); font-variant-numeric: tabular-nums; min-width: 54px; }
.restpill span { font: 600 12px var(--font); text-transform: uppercase; opacity: .6; }
.restpill button { height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255, 255, 255, .14); font: 600 15px var(--round); }

/* seletor de peso */
.wp-val { text-align: center; margin: 4px 0 2px; }
.wp-val b { font: 700 78px/1 var(--round); font-variant-numeric: tabular-nums; letter-spacing: -.03em; display: inline-block; }
.wp-val small { display: block; font: 600 13px var(--font); color: var(--muted); text-transform: uppercase; margin-top: 4px; }
.wp-hint { text-align: center; color: var(--muted); font-size: 14.5px; margin: 8px 0 12px; min-height: 20px; }
.wp-hint b { color: var(--green-ink); }
.wp-plates { display: flex; flex-direction: column; align-items: center; margin: 6px 0 12px; }
.wp-plates svg { width: 100%; max-width: 380px; height: 84px; }
.wp-plates p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.ruler-w { display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; gap: 6px; }
.ruler-w > button { height: 50px; border-radius: 50%; background: #fff; border: .5px solid var(--hair); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--blue); }
.ruler { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 calc(50% - 30px); height: 66px; align-items: center; mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
.ruler::-webkit-scrollbar { display: none; }
.ruler button { flex: none; width: 60px; height: 54px; scroll-snap-align: center; font: 600 20px var(--round); color: var(--dim); font-variant-numeric: tabular-nums; transition: color .25s, transform .4s var(--spring); position: relative; }
.ruler button::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 2px; height: 8px; border-radius: 1px; background: var(--hair2); transform: translateX(-50%); transition: all .3s; }
.ruler button.on { color: var(--text); transform: scale(1.2); }
.ruler button.on::after { background: var(--accent); height: 13px; }

/* formulários */
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font: 400 13px var(--font); text-transform: uppercase; color: var(--muted); margin: 0 4px 7px; }
.inp { width: 100%; height: 50px; border-radius: 14px; background: #fff; border: .5px solid var(--hair2); padding: 0 14px; font-size: 17px; outline: 0; transition: box-shadow .25s; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
.inp:focus { box-shadow: 0 0 0 4px rgba(0, 122, 255, .18); border-color: var(--blue); }
textarea.inp { height: 110px; padding: 10px 14px; font: 13px/1.4 ui-monospace, monospace; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--hair2); transition: transform .45s var(--spring), box-shadow .3s; }
.colors button.on { transform: scale(1.12); box-shadow: 0 0 0 2.5px var(--c); }
.er { display: grid; grid-template-columns: 24px 30px 50px 1fr auto; align-items: center; gap: 8px; padding: 8px 6px 8px 4px; background: rgba(255, 255, 255, .8); border: 1px solid rgba(255, 255, 255, .9); border-radius: 20px; margin-bottom: 7px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
.er-h { display: grid; place-items: center; color: var(--dim); touch-action: none; cursor: grab; height: 40px; }
.er-n { font: 700 16px var(--round); color: var(--accent); text-align: center; }
.er-t { min-width: 0; text-align: left; }
.er-t b { display: block; font-size: 14.5px; line-height: 1.2; font-weight: 600; }
.er-t small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.er-a { display: flex; gap: 0; }
.er-a button { width: 30px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.er-a button svg.i { width: 17px; height: 17px; }
.er-x { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 0 2px 34px; animation: rise .4s var(--ease); }
.er-x label { font: 400 12px var(--font); text-transform: uppercase; color: var(--muted); display: grid; gap: 5px; }
.er-x .inp { height: 46px; font: 700 20px var(--round); text-align: center; }
.sortable-ghost { opacity: .35; }
.sortable-chosen { box-shadow: var(--shadow-lg); transform: scale(1.02); }
.biof { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.biof .field { margin-bottom: 0; }
.biof .field > span { text-transform: none; font-size: 13px; }
.biof .inp { font: 600 20px var(--round); }

.opt { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; font-size: 16px; border-top: .5px solid var(--hair); }
.opt:first-child { border-top: 0; }
.opt .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.opt .rd { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hair2); display: grid; place-items: center; transition: border-color .3s; }
.opt.on .rd { border-color: var(--blue); }
.opt.on .rd::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); animation: pop .45s var(--spring); }
.opt small { display: block; color: var(--muted); font-size: 13px; }

.dt-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.wlist { display: flex; flex-wrap: wrap; gap: 6px; }

/* resumo / foguinho grande */

.fire-hero { display: grid; place-items: center; text-align: center; padding: 6px 0 4px; }

.toast { position: fixed; left: 50%; top: calc(12px + var(--sat)); transform: translate(-50%, -160%) scale(.9); z-index: 120; background: rgba(28, 28, 30, .88); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; padding: 12px 18px; border-radius: 24px; font-weight: 500; font-size: 15px; box-shadow: 0 14px 40px -10px rgba(0, 0, 0, .4); transition: transform .6s var(--spring); max-width: calc(100% - 32px); text-align: center; }

.confetti { position: fixed; top: 38%; left: 50%; width: 9px; height: 14px; border-radius: 3px; z-index: 125; pointer-events: none; animation: conf 1.5s cubic-bezier(.15, .7, .35, 1) forwards; }
@keyframes conf { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

/* treino em andamento */
.mini { position: fixed; left: 50%; bottom: calc(88px + var(--sab)); transform: translate(-50%, 24px) scale(.96); opacity: 0; width: calc(100% - 32px); max-width: 490px; z-index: 29; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 26px; text-align: left;
  background: linear-gradient(150deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6)); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--gb); box-shadow: var(--shadow-lg); transition: transform .6s var(--spring), opacity .4s; }

@keyframes sweep { 0% { transform: translateX(-130%); } 22%, 100% { transform: translateX(130%); } }
.logo-tile svg { width: 46px; height: 46px; fill: none; stroke: #fff; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }

.kp { display: grid; grid-template-columns: repeat(3, 70px); gap: 12px 24px; justify-content: center; margin: 10px 0 4px; }
.kpb { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .72); border: 1px solid var(--gb); box-shadow: 0 1px 3px rgba(0, 0, 0, .06), inset 0 1px 0 #fff; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font: 400 30px/1 var(--title); color: var(--text); transition: transform .3s var(--spring), background .1s; }
.kpb:active { background: #fff; transform: scale(.9); transition-duration: .06s; }

@keyframes shake { 15%, 55% { transform: translateX(-10px); } 35%, 75% { transform: translateX(10px); } 90% { transform: translateX(-3px); } }
@media (max-height: 700px) { .kp { grid-template-columns: repeat(3, 64px); gap: 9px 22px; margin-top: 8px; } .kpb { width: 64px; height: 64px; font-size: 27px; } .logo-tile { width: 62px; height: 62px; border-radius: 18px; } .logo-tile svg { width: 38px; height: 38px; } .wordmark { font-size: 26px; } .tagline { display: none; } .lock-in { gap: 12px; } .who .avatar { width: 48px; height: 48px; font-size: 18px; } }

<div class="bgfx" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ============ Motor de animação dos exercícios ============ */
const Anim = (() => {
  const T = 46, UA = 27, FA = 25, TH = 38, SH = 38, FT = 12, CX = 120, FL = 188;
  const R = Math.PI / 180;
  const dir = a => [Math.sin(a * R), Math.cos(a * R)];
  const dirm = (a, m) => [m * Math.sin(a * R), Math.cos(a * R)];
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const lerp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  const hyp = v => Math.hypot(v[0], v[1]);
  const nrm = v => { const l = hyp(v) || 1; return [v[0] / l, v[1] / l]; };
  const angOf = v => Math.atan2(v[0], v[1]) / R;
  const f1 = n => Math.round(n * 10) / 10;
  const P2 = p => f1(p[0]) + ',' + f1(p[1]);

  /* ---------- primitives ---------- */
  const ln = (a, b, c, w) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${c}"${w ? ` stroke-width="${w}"` : ''}/>`;
  const pl = (pts, c) => `<polyline points="${pts.map(P2).join(' ')}" class="${c}"/>`;
  const ci = (p, r, c) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" class="${c}"/>`;
  const G = {
    ln: (a, b, c = 'eq', w) => ln(a, b, c, w),
    pad: (a, b, w = 8) => ln(a, b, 'pad', w),
    bench: (x1, x2, y) => ln([x1, y], [x2, y], 'pad', 7) + ln([x1 + 8, y + 4], [x1 + 8, FL], 'eq', 3) + ln([x2 - 8, y + 4], [x2 - 8, FL], 'eq', 3),
    seat: (j, ext = 22) => { const y = j.H[1] + 9; return ln([j.H[0] - 14, y], [j.H[0] + ext, y], 'pad', 7) + ln([j.H[0] + 2, y + 4], [j.H[0] + 2, FL], 'eq', 3); },
    back: (j, lo = -6, hi = 6, off = 9) => ln(add(add(j.H, j.u, lo), j.back, off), add(add(j.N, j.u, hi), j.back, off), 'pad', 7),
    post: (x, y1, y2 = FL) => ln([x, y1], [x, y2], 'eq', 4),
    rect: (x, y, w, h, c = 'padf', rx = 2) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx}" class="${c}"/>`,
    roller: (p, r = 5.5) => ci(p, r, 'roll'),
    box: (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" class="box"/>`,
    wall: (x) => `<rect x="${x}" y="14" width="8" height="${FL - 14}" class="wall"/>`,
    stack: (x = 6) => `<rect x="${x}" y="46" width="16" height="${FL - 46}" rx="3" class="stk"/>` + [0, 1, 2, 3, 4, 5, 6, 7].map(i => ln([x + 2, 120 + i * 8], [x + 14, 120 + i * 8], 'stkl')).join('')
  };
  function benchUnder(j, lo = -12, hi = 18, off = 10) {
    const a = add(add(j.H, j.u, lo), j.back, off), b = add(add(j.N, j.u, hi), j.back, off);
    const p1 = lerp(a, b, .15), p2 = lerp(a, b, .85);
    return G.pad(a, b, 7) + ln(p1, [p1[0], FL], 'eq', 3) + ln(p2, [p2[0], FL], 'eq', 3);
  }
  const frontPad = (j, lo, hi, off = 11) => G.pad(add(add(j.H, j.u, lo), j.front, off), add(add(j.H, j.u, hi), j.front, off), 8);
  const shinRoller = (L, side = 1, f = .86) => { const n = dir(angOf(sub(L[2], L[1])) + 90); return G.roller(add(lerp(L[1], L[2], f), n, 6 * side)); };
  const lever = (h, piv) => ln(piv, h, 'lev', 3) + ci(piv, 4, 'pul');
  const crossFrame = () => G.post(226, 14) + G.post(14, 14) + ln([14, 14], [226, 14], 'eq', 3);

  /* ---------- IK ---------- */
  function ik(root, tgt, l1, l2, pf) {
    let d = sub(tgt, root), dist = hyp(d);
    const mx = l1 + l2 - .05;
    if (dist > mx) { d = [d[0] * mx / dist, d[1] * mx / dist]; dist = mx; }
    if (dist < 1e-3) { d = [0, 1e-3]; dist = 1e-3; }
    const dd = Math.max(dist, Math.abs(l1 - l2) + 1);
    const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd))));
    const base = Math.atan2(d[1], d[0]);
    const c1 = [root[0] + l1 * Math.cos(base + a), root[1] + l1 * Math.sin(base + a)];
    const c2 = [root[0] + l1 * Math.cos(base - a), root[1] + l1 * Math.sin(base - a)];
    const end = add(root, d), m = lerp(root, end, .5);
    const s1 = (c1[0] - m[0]) * pf[0] + (c1[1] - m[1]) * pf[1];
    const s2 = (c2[0] - m[0]) * pf[0] + (c2[1] - m[1]) * pf[1];
    return [s1 >= s2 ? c1 : c2, end];
  }

  const MAP = {
    an: { a1: 'a1', a2: 'a2', s1: 'us', s2: 'fs', T: 'A', Ta: 'Aa', Tb: 'Ab', J: 'Ea', pf: 'ep', pj: 'apj' },
    af: { a1: 'b1', a2: 'b2', s1: 'bus', s2: 'bfs', T: 'B', Ta: 'Ba', Tb: 'Bb', J: 'Eb', pf: 'fp', pj: 'bpj' },
    ln: { a1: 'l1', a2: 'l2', s1: 'ls', s2: 'ss', T: 'L', Ta: 'La', Tb: 'Lb', J: 'Ka', pf: 'kp', pj: 'lpj' },
    lf: { a1: 'r1', a2: 'r2', s1: 'rls', s2: 'rss', T: 'R', Ta: 'Ra', Tb: 'Rb', J: 'Rka', pf: 'rp', pj: 'rpj' }
  };
  function spec(P, m) { const o = {}; for (const k in m) { const v = P[m[k]]; if (v !== undefined) o[k] = v; } return o; }
  const has = o => o.a1 !== undefined || o.T || o.Ta || o.Tb || (o.J && (o.Ta || o.T));
  function farSpec(P, near, mf) {
    const o = spec(P, mf);
    if (!has(o)) return Object.assign({}, near, { mir: 1, pf: o.pf || near.pf, pj: o.pj !== undefined ? o.pj : near.pj });
    return Object.assign({ pf: near.pf, pj: near.pj }, o);
  }
  function solveLimb(root, o, l1, l2, m, ctx, defPf) {
    const F = ctx.F;
    const dd = a => F ? dirm(a, m) : dir(a);
    if (o.a1 !== undefined) {
      const j = add(root, dd(o.a1), l1 * (o.s1 ?? 1));
      const e = add(j, dd(o.a2 ?? o.a1), l2 * (o.s2 ?? 1));
      return [j, e];
    }
    let t, rel = true;
    if (o.Ta) { t = (F && o.mir) ? [2 * CX - o.Ta[0], o.Ta[1]] : o.Ta.slice(); rel = false; }
    else if (o.Tb) t = F ? add(root, [m * o.Tb[0], -o.Tb[1]]) : add(add(root, ctx.front, o.Tb[0]), ctx.up, o.Tb[1]);
    else if (o.T) t = add(root, [F ? m * o.T[0] : o.T[0], o.T[1]]);
    else t = add(root, [0, l1 + l2]);
    if (ctx.shift && rel) t = [t[0] + ctx.shift, t[1]];

      return [add(md, p, typeof o.pj === 'number' ? o.pj : 3), e];
    }
    return ik(root, t, l1, l2, pf);
  }

  function solveS(P) {

    const front = dir(P.t - 90), back = dir(P.t + 90);

    const ctx = { F: 0, front, up: u };
    const an = spec(P, MAP.an), af = farSpec(P, an, MAP.af);

  }

    return { F: 1, H, N, u, p, hd, SR, SL, HR, HL, sh, arms: [[SR, eR, hR], [SL, eL, hL]], legs: [[HR, kR, aR, add(aR, [7, 1])], [HL, kL, aL, add(aL, [-7, 1])]], P };

  /* ---------- figure ---------- */

  /* ---------- muscle highlights ---------- */
  function hiS(j, tags) {
    let s = '';
    const seg = (a, b, x0, x1, n, off, w) => ln(add(lerp(a, b, x0), n, off), add(lerp(a, b, x1), n, off), 'hi', w);

    const { H, N } = j;
    for (const t of tags) switch (t) {

      case 'abs': s += seg(H, N, .14, .5, j.front, 4, 6); break;
      case 'obl': s += seg(H, N, .15, .52, j.front, 1, 6); break;
      case 'lats': s += seg(H, N, .45, .85, j.back, 4, 6); break;
      case 'lowback': s += seg(H, N, .08, .4, j.back, 4, 6); break;
      case 'traps': s += seg(H, N, .84, 1.08, j.back, 3, 6); break;
      case 'delts': s += ci(N, 5.5, 'hi'); break;
      case 'fdelt': s += ci(add(N, j.front, 3), 5, 'hi'); break;
      case 'rdelt': s += ci(add(N, j.back, 3), 5, 'hi'); break;
      case 'biceps': s += lim(j.arms[0], 0, 1); break;
      case 'triceps': s += lim(j.arms[0], 0, 0); break;
      case 'forearm': s += lim(j.arms[0], 1, 1, .1, .8, 0, 5); break;
      case 'quads': s += lim(j.legs[0], 0, 1, .12, .85, 2.5, 6); break;
      case 'hams': s += lim(j.legs[0], 0, 0, .12, .85, 2.5, 6); break;
      case 'adduct': case 'abduct': s += lim(j.legs[0], 0, 0, .2, .8, 0, 5); break;
      case 'glutes': s += ci(add(H, j.back, 4), 6, 'hi'); break;
      case 'calves': s += lim(j.legs[0], 1, 0, .1, .55, 2.5, 6); break;
      case 'tib': s += lim(j.legs[0], 1, 1, .1, .6, 2, 5); break;

/* ---------- seletor de peso ---------- */
let WP = null;
function platesSVG(w) {
  const per = (w - 20) / 2; let rem = Math.round(per * 100) / 100; const used = [];
  for (const p of PLATES) while (rem >= p - 1e-9 && used.length < 10) { used.push(p); rem = Math.round((rem - p) * 100) / 100; }
  const H = { 25: 74, 20: 70, 15: 62, 10: 54, 5: 40, 2.5: 32, 1.25: 26, .5: 20 }, Wd = p => p >= 10 ? 12 : p >= 2.5 ? 9 : 6;
  let s = `<svg viewBox="0 0 380 84" aria-hidden="true"><rect x="8" y="38" width="364" height="8" rx="3" fill="#aeaeb2"/><rect x="128" y="36" width="124" height="12" rx="3" fill="#8e8e93"/><rect x="118" y="28" width="10" height="28" rx="2" fill="#636366"/><rect x="252" y="28" width="10" height="28" rx="2" fill="#636366"/>`;
  let xr = 264, xl = 116;
  for (const p of used) { const h = H[p], wd = Wd(p), c = p === 5 ? '#d1d1d6' : PLATE_COLORS[p]; s += `<rect x="${xr}" y="${42 - h / 2}" width="${wd}" height="${h}" rx="3" fill="${c}"/><rect x="${xl - wd}" y="${42 - h / 2}" width="${wd}" height="${h}" rx="3" fill="${c}"/>`; xr += wd + 2; xl -= wd + 2; }
  s += '</svg>';
  const txt = used.length ? `Barra 20 kg + de cada lado: ${used.map(fmtW).join(' + ')} kg${rem > 0 ? ' (aprox.)' : ''}` : 'Só a barra (20 kg)';
  return s + `<p>${txt}</p>`;
}
function openWeightPicker(i, j) {
  const s = curS(), it = s.items[i], e = EXI[it.ex], list = WEIGHTS[e.eq] || WEIGHTS.mc, last = lastPerf(it.ex, s.date), sg = suggest(it.ex, s.date, true);
  const cur = it.sets[j].w ?? (j > 0 && it.sets[j - 1].w != null ? it.sets[j - 1].w : null) ?? (last ? last.top : null) ?? list[Math.min(list.length - 1, e.eq === 'db' ? 7 : e.eq === 'bar' ? 8 : 4)];
  let k = 0, bd = Infinity; list.forEach((v, n) => { const d = Math.abs(v - cur); if (d < bd) { bd = d; k = n; } });
  WP = { i, j, list, k, eq: e.eq };
  const hint = [last && last.top != null ? `Último: ${fmtW(last.top)} kg` : '', sg ? `Sugestão: <b>${fmtW(sg.to)} kg</b>` : ''].filter(Boolean).join(' · ');
  const body = `<div class="wp-val"><b id="wp-v">${fmtW(list[k])}</b><small>${EQUIP[e.eq].unit}</small></div><div class="wp-hint">${hint || 'Arraste a régua ou use − e +'}</div>${e.eq === 'bar' ? `<div class="wp-plates" id="wp-p"></div>` : ''}<div class="ruler-w"><button class="tap" data-a="wpStep" data-v="-1" aria-label="Diminuir">${I.minus}</button><div class="ruler" id="wp-r">${list.map((v, n) => `<button data-a="wpK" data-k="${n}">${fmtW(v)}</button>`).join('')}</div><button class="tap" data-a="wpStep" data-v="1" aria-label="Aumentar">${I.plus}</button></div>`;
  const o = openSheet({ title: esc(e.name), sub: `Série ${j + 1} de ${it.sets.length} · ${EQUIP[e.eq].name}`, body, foot: `<button class="btn tap" data-a="wpOne">Só esta série</button><button class="btn primary tap" data-a="wpAll">Todas pendentes</button>`, key: 'wp', onClose: () => { WP = null; } });
  const r = $('#wp-r', o.sh);

  r.addEventListener('scroll', () => { if (!WP) return; const kk = clamp(Math.round(r.scrollLeft / 60), 0, WP.list.length - 1); if (kk !== WP.k) { WP.k = kk; wpPaint(); buzz(3); } }, { passive: true });
}
function wpPaint(first) {

  const ve = $('#wp-v'); if (ve) { ve.textContent = fmtW(v); if (!first) { ve.classList.remove('bump'); void ve.offsetWidth; ve.classList.add('bump'); } }

function openSummary(ds) {

  cMin: t => { const s = curS(), i = +t.dataset.i, c = s.cardio[i]; c.min = clamp((+c.min || 0) + (+t.dataset.v), 5, 240); putSession(s); const sp = $(`#cc-${i} .step span`); if (sp) { sp.innerHTML = `${c.min}<small>min</small>`; sp.classList.remove('bump'); void sp.offsetWidth; sp.classList.add('bump'); } buzz(4); },
  cLvl: t => { const s = curS(), c = s.cardio[+t.dataset.i]; c.lvl = t.dataset.v; putSession(s); $$(`#cc-${t.dataset.i} .seg button`).forEach(b => b.classList.toggle('on', b === t)); buzz(4); },
  cDone: t => { const s = curS(), c = s.cardio[+t.dataset.i]; c.done = !c.done; putSession(s); t.classList.toggle('on', c.done); t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); t.closest('.cc').classList.toggle('done', c.done); if (c.done) burst(t, '#007AFF'); updProg(); buzz(12); },
  cDel: t => { const s = curS(); s.cardio.splice(+t.dataset.i, 1); putSession(s); renderSession(); },
  sSec: t => { const s = curS(), i = +t.dataset.i, c = s.stretch[i]; c.sec = clamp((+c.sec || 0) + (+t.dataset.v), 15, 180); putSession(s); const sp = $(`#st-${i} .step span`); if (sp) { sp.innerHTML = `${c.sec}<small>s</small>`; sp.classList.remove('bump'); void sp.offsetWidth; sp.classList.add('bump'); } buzz(4); },
  sHold: t => { ensureAudio(); const s = curS(), i = +t.dataset.i; if (UI.holds[i]) delete UI.holds[i]; else UI.holds[i] = { end: Date.now() + s.stretch[i].sec * 1000, total: s.stretch[i].sec }; replaceEl('st-' + i, stHTML(s, i)); buzz(8); },
  sDone: t => { const s = curS(), i = +t.dataset.i; delete UI.holds[i]; s.stretch[i].done = !s.stretch[i].done; putSession(s); replaceEl('st-' + i, stHTML(s, i)); if (s.stretch[i].done) burst($('#st-' + i + ' .chk')); updProg(); buzz(12); },
  sDel: t => { const s = curS(); s.stretch.splice(+t.dataset.i, 1); UI.holds = {}; putSession(s); renderSession(); },
  restAdd: () => { if (UI.rest) { UI.rest.end += 15000; tickTimers(); buzz(5); } },
  restSkip: () => { UI.rest = null; tickTimers(); buzz(5); },

  // seletor de peso
  wpStep: t => WP && wpSet(WP.k + (+t.dataset.v)),
  wpK: t => wpSet(+t.dataset.k),
  wpOne: () => wpApply(false),
  wpAll: () => wpApply(true),

  // seletor de exercícios
  pkG: t => { PK.g = t.dataset.g; $('#pk-g').innerHTML = groupChips(PK.g, 'pkG', PK.only); pkRefresh(); },
  pkToggle: t => { const id = t.dataset.id, n = PK.sel.indexOf(id); if (n >= 0) PK.sel.splice(n, 1); else PK.sel.push(id); buzz(6); const on = n < 0; t.classList.toggle('on', on); pkRefresh(); },
  pkDone: () => { if (!PK || !PK.sel.length) return; const ids = PK.sel.slice(), f = PK.onDone; closeSheet(topSheet('pk')); f(ids); buzz(10); },

  // editor
  edColor: t => { ED.color = t.dataset.c; $('#ed-c').innerHTML = edColors(); buzz(5); },
  edGroup: t => { const g = t.dataset.g, n = ED.groups.indexOf(g); if (n >= 0) ED.groups.splice(n, 1); else ED.groups.push(g); $('#ed-g').innerHTML = edGroups(); buzz(5); },
  edRow: t => { const i = +t.dataset.i; ED.openRow = ED.openRow === i ? -1 : i; edRefresh(); },
  edMove: t => { const i = +t.dataset.i, j = i + (+t.dataset.v); if (j < 0 || j >= ED.items.length) return; [ED.items[i], ED.items[j]] = [ED.items[j], ED.items[i]]; ED.openRow = ED.openRow === i ? j : ED.openRow === j ? i : ED.openRow; edRefresh(); buzz(6); },
  edDel: t => { ED.items.splice(+t.dataset.i, 1); ED.openRow = -1; edRefresh(); buzz(6); },
  edSets: t => { const it = ED.items[+t.dataset.i]; it.sets = clamp((+it.sets || 3) + (+t.dataset.v), 1, 12); edRefresh(); buzz(4); },
  edAdd: () => openPicker({ title: 'Escolha os exercícios', preset: ED.groups.length === 1 ? ED.groups[0] : 'all', cta: 'Adicionar', onDone: ids => { ids.forEach(id => { const e = EXI[id]; ED.items.push({ ex: id, sets: e.eq === 'cardio' || e.eq === 'stretch' ? 1 : 3, reps: e.unit === 's' ? '30' : e.unit === 'm' ? '20' : '10' }); if (!ED.groups.includes(e.group) && STRENGTH_GROUPS.some(g => g.id === e.group)) ED.groups.push(e.group); }); $('#ed-g').innerHTML = edGroups(); edRefresh(); } }),
  edSave: () => { const w = edCommit(); closeSheet(topSheet('ed')); render(); toast(`“${w.name}” salvo`); buzz(12); },
  edStart: () => { const w = edCommit(); const ds = todayISO(); closeSheet(topSheet('ed')); const s = getSession(ds); if (s && (s.items.length || s.cardio.length)) { openSession(ds); toast('Já existe um treino hoje — abri ele para você.'); return; } if (s) delSession(ds); startSession(ds, w.id); },
  edDelete: () => confirmSheet({ title: 'Excluir treino?', text: 'Os registros dos dias já treinados continuam salvos. Dias da semana com este treino passam a ficar livres.', ok: 'Excluir', danger: true, onOk: () => { const id = ED && ED.id; CFG.workouts = CFG.workouts.filter(w => w.id !== id); for (const k in CFG.week) if (CFG.week[k] === id) CFG.week[k] = 'free'; for (const k in CFG.overrides) if (CFG.overrides[k] === id) delete CFG.overrides[k]; saveCfg(); closeSheet(topSheet('ed')); render(); toast('Treino excluído'); } }),

  // ajustes
  restStep: t => { CFG.settings.rest = clamp(CFG.settings.rest + (+t.dataset.v), 15, 600); saveCfg(); $('#rest-def').textContent = fmtDur(CFG.settings.rest * 1000); buzz(4); },
  copyBackup: async () => { const txt = JSON.stringify({ app: 'gymapp', v: 2, cfg: CFG, md: MD }); try { await navigator.clipboard.writeText(txt); toast('Backup copiado. Guarde em uma nota.'); } catch (e) { const ta = $('#bk'); if (ta) { ta.value = txt; ta.select(); } toast('Copie o texto que apareceu no campo abaixo.'); } },
  restoreBackup: () => { const ta = $('#bk'); let o; try { o = JSON.parse(ta.value); } catch (e) { toast('Esse texto não é um backup válido.'); return; } if (!o || !o.cfg) { toast('Esse texto não é um backup válido.'); return; } confirmSheet({ title: 'Restaurar backup?', text: 'Os dados atuais deste perfil serão substituídos pelos do backup.', ok: 'Restaurar', onOk: () => { const p = curProf(); for (const k of Object.keys(MD)) { delete DOCS[did(k)]; Store.mark(did(k)); } CFG = fixCfg(o.cfg); if (p) CFG.name = p.name; DOCS[did('config')] = CFG; MD = o.md || {}; touch('config'); for (const k in MD) touch(k); loadProfile(PID); while (SHEETS.length) closeSheet(); render(true); toast('Backup restaurado'); } }); },
  resetAll: () => confirmSheet({ title: 'Zerar dados deste perfil?', text: 'Treinos montados, agenda, medições e todo o histórico de pesos deste perfil serão apagados. Não dá para desfazer.', ok: 'Zerar', danger: true, onOk: () => { const p = curProf(); for (const k of Object.keys(MD)) { delete DOCS[did(k)]; Store.mark(did(k)); } CFG = defaultCfg(p ? p.name : ''); DOCS[did('config')] = CFG; MD = {}; touch('config'); while (SHEETS.length) closeSheet(); render(true); toast('Dados zerados'); } }),
  delProfile: () => { const o = openSheet({ title: 'Apagar perfil?', key: 'delp', body: `<form data-f="delprof"><p style="color:var(--muted);margin:4px 2px 14px;line-height:1.45">Todos os treinos, pesos e medições de <b style="color:var(--text)">${esc(CFG.name)}</b> serão apagados. Digite ${curProf() && curProf().kind === 'pin' ? 'o PIN' : 'a senha'} do perfil para confirmar.</p><div class="field pw"><input class="inp" type="password" id="dp-pw" ${curProf() && curProf().kind === 'pin' ? 'inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN"' : 'placeholder="Senha"'} autocomplete="off"></div></form>`, foot: `<button class="btn tap" data-a="closeSheet">Cancelar</button><button class="btn danger tap" data-a="delProfGo">Apagar</button>` }); },
  delProfGo: () => FORMS.delprof()
};
const INP = {
  libQ: t => { UI.libQ = t.value; $('#lib-list').innerHTML = libList(); hydrate($('#lib-list')); },
  pkQ: t => { if (PK) { PK.q = t.value; pkRefresh(); } },
  edName: t => { if (ED) ED.name = t.value; },
  edReps: t => { if (ED) ED.items[+t.dataset.i].reps = t.value.replace(/[^0-9\-–]/g, '').slice(0, 7); },
  setName: t => { const n = t.value.trim(); CFG.name = n; saveCfg(); const p = curProf(); if (p && n) { p.name = n; profDoc().u = Date.now(); Store.mark('profiles'); } },
  setHeight: t => { const v = parseInt(t.value, 10); CFG.height = v >= 100 && v <= 250 ? v : null; saveCfg(); }
};
let tabDown = 0;
document.addEventListener('pointerdown', e => { const t = e.target.closest('.tab[data-t]'); if (!t || e.button > 0) return; tabDown = Date.now(); go(t.dataset.t); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  if (t.dataset.a === 'tab' && Date.now() - tabDown < 900) { e.preventDefault(); return; }
  const f = ACT[t.dataset.a]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.f; if (FORMS[f]) FORMS[f](e.target); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.in && INP[t.dataset.in]) INP[t.dataset.in](t, e); if (t.closest && t.closest('#lock')) { const er = $('#lk-err'); if (er) er.textContent = ''; } });
document.addEventListener('change', e => { if (e.target.id === 'lk-rem') UI.lock.rem = e.target.checked; });
document.addEventListener('keydown', e => {
  const lk = $('#lock'); if (lk && !lk.classList.contains('out') && KP_MODES.includes(UI.lock.mode) && !(e.target.matches && e.target.matches('input'))) { if (/^\d$/.test(e.key)) { kpPress(e.key); return; } if (e.key === 'Backspace') { kpPress('del'); return; } }
  if (e.key === 'Escape') { if (SHEETS.length) closeSheet(); else if (UI.sess) closeSession(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && PID) { bump(); tickTimers(); if (!UI.sess && UI.tab === 'hoje') render(); } });

/* ============ Início ============ */
function boot() {
  $('nav.tabs').innerHTML = '<span class="tab-pill"></span>' + [['hoje', 'Hoje', I.home], ['agenda', 'Agenda', I.cal], ['treinos', 'Treinos', I.dumb], ['exercicios', 'Exercícios', I.list], ['evolucao', 'Evolução', I.chart]].map(([t, l, ic]) => `<button class="tab tap" data-a="tab" data-t="${t}">${ic}<span>${l}</span></button>`).join('');
  Store.loadAll();
  const h = (location.hash || '').slice(1);
  if (TABS.includes(h)) UI.tab = h;
  let pid = null;
  try { pid = sessionStorage.getItem('tr2-open') || localStorage.getItem('tr2-last'); } catch (e) { }
  if (pid && profList().some(p => p.id === pid)) { loadProfile(pid); render(true); }
  else showLock();
  Store.connect();
}
boot();

</script>
</body>
</html>
